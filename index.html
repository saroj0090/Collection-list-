<script>

/* =========================================================
   GOOGLE SHEET CONNECTION
   ========================================================= */

/*
   YOUR SPREADSHEET:

   ID:
   1AxAm7z3pv-p5x5iAOObnJ0AgHIp_kzIIyDvAbdSLFwY

   SHEET:
   Sheet1
*/

const GOOGLE_SHEET_ID =
    "1AxAm7z3pv-p5x5iAOObnJ0AgHIp_kzIIyDvAbdSLFwY";

const GOOGLE_SHEET_NAME =
    "Sheet1";


/*
   Automatically creates the CSV connection.

   You do NOT need to put /edit?usp=drivesdk here.
*/

const GOOGLE_SHEET_URL =
    "https://docs.google.com/spreadsheets/d/" +
    GOOGLE_SHEET_ID +
    "/gviz/tq?tqx=out:csv&sheet=" +
    encodeURIComponent(GOOGLE_SHEET_NAME);


/* =========================================================
   COLLECTION START
   ========================================================= */

const START_YEAR = 2026;

/*
   JavaScript:
   January = 0
   February = 1
   ...
   July = 6
*/

const START_MONTH = 6;


/* =========================================================
   MONTH NAMES
   ========================================================= */

const MONTHS = [
    "JANUARY",
    "FEBRUARY",
    "MARCH",
    "APRIL",
    "MAY",
    "JUNE",
    "JULY",
    "AUGUST",
    "SEPTEMBER",
    "OCTOBER",
    "NOVEMBER",
    "DECEMBER"
];


let allData = [];
let selectedMonth = "";


/* =========================================================
   GENERATE MONTHS

   JULY 2026 → CURRENT MONTH

   Example August 2026:

   JULY 2026
   AUGUST 2026

   September will NOT appear until September arrives.

   When January 2027 arrives:

   JULY 2026
   AUGUST 2026
   ...
   DECEMBER 2026
   JANUARY 2027
========================================================= */

function generateMonths(){

    const select =
        document.getElementById("monthSelect");

    select.innerHTML = "";

    const start =
        new Date(
            START_YEAR,
            START_MONTH,
            1
        );

    const now =
        new Date();

    const end =
        new Date(
            now.getFullYear(),
            now.getMonth(),
            1
        );

    let date =
        new Date(start);


    while(date <= end){

        const year =
            date.getFullYear();

        const month =
            date.getMonth();


        const value =
            year +
            "-" +
            String(month + 1).padStart(2,"0");


        const option =
            document.createElement("option");

        option.value =
            value;

        option.textContent =
            MONTHS[month] +
            " " +
            year;


        select.appendChild(option);

        date.setMonth(
            date.getMonth() + 1
        );
    }


    /*
       CURRENT MONTH is automatically selected.
    */

    const currentValue =
        now.getFullYear() +
        "-" +
        String(now.getMonth() + 1)
            .padStart(2,"0");


    if(
        select.querySelector(
            `option[value="${currentValue}"]`
        )
    ){

        selectedMonth =
            currentValue;

    }else{

        selectedMonth =
            select.options[
                select.options.length - 1
            ]?.value || "";
    }


    select.value =
        selectedMonth;
}


/* =========================================================
   CSV PARSER
========================================================= */

function parseCSV(text){

    const rows = [];

    let row = [];
    let cell = "";
    let quotes = false;


    for(
        let i = 0;
        i < text.length;
        i++
    ){

        const char =
            text[i];

        const next =
            text[i + 1];


        if(
            char === '"' &&
            quotes &&
            next === '"'
        ){

            cell += '"';
            i++;

        }

        else if(
            char === '"'
        ){

            quotes =
                !quotes;

        }

        else if(
            char === "," &&
            !quotes
        ){

            row.push(
                cell.trim()
            );

            cell = "";

        }

        else if(
            (char === "\n" ||
             char === "\r") &&
            !quotes
        ){

            if(
                cell !== "" ||
                row.length > 0
            ){

                row.push(
                    cell.trim()
                );

                rows.push(row);

                row = [];
                cell = "";
            }

        }

        else{

            cell += char;
        }
    }


    if(
        cell !== "" ||
        row.length > 0
    ){

        row.push(
            cell.trim()
        );

        rows.push(row);
    }


    return rows;
}


/* =========================================================
   CLEAN HEADER
========================================================= */

function cleanHeader(value){

    return String(value || "")
        .trim()
        .toLowerCase()
        .replace(/[\s_-]+/g,"");
}


/* =========================================================
   FIND COLUMN
========================================================= */

function findColumn(headers,names){

    for(
        const name of names
    ){

        const index =
            headers.indexOf(
                cleanHeader(name)
            );

        if(index >= 0){
            return index;
        }
    }

    return -1;
}


/* =========================================================
   MONTH NORMALIZER
========================================================= */

function normalizeMonth(value){

    if(!value) return "";

    let v =
        String(value)
        .trim()
        .toUpperCase();


    const map = {

        JAN:"JANUARY",
        JANUARY:"JANUARY",

        FEB:"FEBRUARY",
        FEBRUARY:"FEBRUARY",

        MAR:"MARCH",
        MARCH:"MARCH",

        APR:"APRIL",
        APRIL:"APRIL",

        MAY:"MAY",

        JUN:"JUNE",
        JUNE:"JUNE",

        JUL:"JULY",
        JULY:"JULY",

        AUG:"AUGUST",
        AUGUST:"AUGUST",

        SEP:"SEPTEMBER",
        SEPT:"SEPTEMBER",
        SEPTEMBER:"SEPTEMBER",

        OCT:"OCTOBER",
        OCTOBER:"OCTOBER",

        NOV:"NOVEMBER",
        NOVEMBER:"NOVEMBER",

        DEC:"DECEMBER",
        DECEMBER:"DECEMBER"
    };


    return map[v] || v;
}


/* =========================================================
   PARSE MONTH + YEAR FROM TEXT

   Supports:

   August
   August 2026
   AUG 2026
   2026-08
   08/2026
========================================================= */

function parseMonthYear(value){

    if(!value){

        return {
            month:"",
            year:null
        };
    }


    const text =
        String(value)
        .trim()
        .toUpperCase();


    /*
       YYYY-MM
    */

    let match =
        text.match(
            /^(\d{4})[-\/](\d{1,2})$/
        );


    if(match){

        return {
            month:MONTHS[
                Number(match[2]) - 1
            ],
            year:Number(match[1])
        };
    }


    /*
       MONTH YYYY
    */

    match =
        text.match(
            /^([A-Z]+)\s+(\d{4})$/
        );


    if(match){

        return {
            month:normalizeMonth(
                match[1]
            ),
            year:Number(match[2])
        };
    }


    /*
       YYYY MONTH
    */

    match =
        text.match(
            /^(\d{4})\s+([A-Z]+)$/
        );


    if(match){

        return {
            month:normalizeMonth(
                match[2]
            ),
            year:Number(match[1])
        };
    }


    /*
       Month only
    */

    return {
        month:normalizeMonth(text),
        year:null
    };
}


/* =========================================================
   CONVERT SHEET ROWS
========================================================= */

function convertRows(rows){

    if(
        !rows ||
        rows.length < 2
    ){

        return [];
    }


    const headers =
        rows[0].map(
            cleanHeader
        );


    /*
       Supported names:

       Name
       Member
       Member Name

       Amount
       Money
       Collection

       Month
       Date

       Year
    */

    const nameIndex =
        findColumn(
            headers,
            [
                "name",
                "member",
                "member name"
            ]
        );


    const amountIndex =
        findColumn(
            headers,
            [
                "amount",
                "money",
                "collection"
            ]
        );


    const monthIndex =
        findColumn(
            headers,
            [
                "month"
            ]
        );


    const yearIndex =
        findColumn(
            headers,
            [
                "year"
            ]
        );


    const dateIndex =
        findColumn(
            headers,
            [
                "date"
            ]
        );


    const result = [];


    for(
        let i = 1;
        i < rows.length;
        i++
    ){

        const row =
            rows[i];


        if(!row) continue;


        /*
           If proper headers are not found,
           use:

           Column A = Name
           Column B = Amount
           Column C = Month
           Column D = Year
        */

        const n =
            nameIndex >= 0
            ? nameIndex
            : 0;


        const a =
            amountIndex >= 0
            ? amountIndex
            : 1;


        const m =
            monthIndex >= 0
            ? monthIndex
            : 2;


        const y =
            yearIndex >= 0
            ? yearIndex
            : 3;


        const name =
            String(
                row[n] || ""
            ).trim();


        if(!name) continue;


        const amountText =
            String(
                row[a] || ""
            )
            .replace(/[₹,\s]/g,"");


        const amount =
            Number(amountText) || 0;


        let month = "";
        let year = null;


        /*
           Date column gets priority.
        */

        if(
            dateIndex >= 0 &&
            row[dateIndex]
        ){

            const parsed =
                parseMonthYear(
                    row[dateIndex]
                );

            month =
                parsed.month;

            year =
                parsed.year;


            /*
               Try browser Date for
               values such as 8/15/2026.
            */

            if(!year){

                const d =
                    new Date(
                        row[dateIndex]
                    );

                if(!isNaN(d)){

                    month =
                        MONTHS[
                            d.getMonth()
                        ];

                    year =
                        d.getFullYear();
                }
            }
        }


        /*
           Month column
        */

        if(
            !month &&
            row[m]
        ){

            const parsed =
                parseMonthYear(
                    row[m]
                );

            month =
                parsed.month;

            year =
                parsed.year;
        }


        /*
           Separate Year column
        */

        if(
            row[y] &&
            !year
        ){

            const possibleYear =
                Number(
                    String(
                        row[y]
                    ).trim()
                );


            if(
                possibleYear >= 2000 &&
                possibleYear <= 2100
            ){

                year =
                    possibleYear;
            }
        }


        /*
           IMPORTANT:

           If your Sheet only has Month and
           no Year, old existing rows are
           treated as 2026.

           For 2027+ use a Year column.
        */

        if(!year){

            year = 2026;
        }


        result.push({

            name:name,

            amount:amount,

            month:month,

            year:year

        });
    }


    return result;
}


/* =========================================================

===========================================
