<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>BALIPADA JATRA COMUNITY</title>

<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}

:root{
  --p:#651cff;
  --p2:#9225ff;
  --dark:#252a3e;
  --muted:#777d91;
  --bg:#f8f7fc;
}

body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  background:var(--bg);
  color:var(--dark);
  min-height:100vh;
}

.app{
  width:100%;
  max-width:560px;
  margin:auto;
  padding:18px 17px 35px;
}

/* HEADER */
.header-row{
  min-height:62px;
  display:flex;
  justify-content:center;
  align-items:center;
  position:relative;
}

.title{
  color:#6520c9;
  font-size:clamp(20px,5.7vw,31px);
  font-weight:800;
  line-height:1.1;
  white-space:nowrap;
}

.subtitle{
  text-align:center;
  margin-top:7px;
  color:var(--muted);
  font-size:18px;
  font-weight:600;
}

.menu-btn,.notification-btn{
  position:absolute;
  top:3px;
  width:50px;
  height:50px;
  border:0;
  background:transparent;
  display:flex;
  align-items:center;
  justify-content:center;
}

.menu-btn{left:0}
.notification-btn{right:0}

.menu-icon{
  width:42px;
  height:30px;
  display:flex;
  flex-direction:column;
  justify-content:space-between;
}

.menu-icon span{
  height:6px;
  width:100%;
  border-radius:10px;
  background:var(--p);
}

.bell{
  width:29px;
  height:30px;
  border:4px solid var(--p);
  border-radius:16px 16px 8px 8px;
  position:relative;
}

.bell:after{
  content:"";
  position:absolute;
  width:11px;
  height:4px;
  background:var(--p);
  border-radius:5px;
  bottom:-8px;
  left:50%;
  transform:translateX(-50%);
}

/* LOGO */
.logo-wrap{
  width:108px;
  height:108px;
  margin:20px auto;
  padding:5px;
  background:#fff;
  border-radius:50%;
  overflow:hidden;
  box-shadow:0 8px 28px rgba(100,30,220,.2);
}

.logo-wrap img{
  width:100%;
  height:100%;
  object-fit:cover;
  border-radius:50%;
  display:block;
}

/* MONTH */
.month-box{
  width:100%;
  height:94px;
  border-radius:28px;
  background:linear-gradient(110deg,#5714d9,#7218ee,#9827ff);
  box-shadow:0 15px 32px rgba(101,28,255,.23);
  position:relative;
  overflow:hidden;
}

.month-select{
  width:100%;
  height:100%;
  padding:0 65px 0 28px;
  border:0;
  outline:0;
  background:transparent;
  color:#fff;
  font-size:clamp(22px,6vw,29px);
  font-weight:800;
  appearance:none;
}

.month-select option{
  color:#252a3e;
  background:#fff;
}

.arrow{
  position:absolute;
  right:28px;
  top:33px;
  width:25px;
  height:25px;
  border-right:6px solid white;
  border-bottom:6px solid white;
  transform:rotate(45deg);
  pointer-events:none;
}

/* SEARCH */
.search-wrap{
  margin:18px 0 16px;
}

.search{
  width:100%;
  height:60px;
  padding:0 20px;
  border:1px solid #e5e3ed;
  border-radius:21px;
  outline:none;
  background:white;
  font-size:18px;
  color:var(--dark);
  box-shadow:0 7px 22px rgba(35,28,70,.06);
}

.search::placeholder{color:#9da2b1}

/* LIST */
.collection-list{
  display:flex;
  flex-direction:column;
  gap:13px;
}

.member-card{
  min-height:94px;
  padding:12px 18px 12px 15px;
  background:#fff;
  border-radius:27px;
  display:flex;
  align-items:center;
  box-shadow:0 7px 23px rgba(35,28,70,.08);
}

.avatar{
  width:66px;
  height:66px;
  min-width:66px;
  border-radius:50%;
  background:linear-gradient(145deg,#7117ff,#9c27ff);
  position:relative;
}

.avatar-head{
  position:absolute;
  width:20px;
  height:20px;
  top:12px;
  left:23px;
  border-radius:50%;
  background:#fff;
}

.avatar-body{
  position:absolute;
  width:40px;
  height:21px;
  bottom:12px;
  left:13px;
  border-radius:24px 24px 12px 12px;
  background:#fff;
}

.member-name{
  flex:1;
  min-width:0;
  margin-left:18px;
  font-size:clamp(19px,5.3vw,25px);
  font-weight:700;
  text-transform:uppercase;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.amount{
  margin-left:10px;
  font-size:clamp(18px,5vw,24px);
  font-weight:800;
  white-space:nowrap;
}

/* TOTAL */
.total-box{
  margin-top:19px;
  min-height:88px;
  padding:0 30px;
  border-radius:46px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  color:#fff;
  background:linear-gradient(110deg,#5c18df,#791df5,#982aff);
  box-shadow:0 15px 32px rgba(101,28,255,.24);
}

.total-label{
  font-size:21px;
  font-weight:800;
}

.total-amount{
  font-size:35px;
  font-weight:900;
}

/* STATES */
.loading,.empty,.error{
  background:#fff;
  border-radius:25px;
  text-align:center;
  padding:40px 20px;
  color:#858b9d;
  font-weight:600;
  box-shadow:0 7px 22px rgba(35,28,70,.05);
}

.error strong{
  display:block;
  color:#651cff;
  margin-bottom:8px;
}

.footer{
  text-align:center;
  margin-top:30px;
  color:#73798d;
  font-size:15px;
  font-weight:600;
}

@media(max-width:390px){
  .app{padding-left:13px;padding-right:13px}
  .title{font-size:20px}
  .logo-wrap{width:100px;height:100px}
  .month-box{height:88px}
  .member-card{min-height:88px;padding-right:14px}
  .avatar{width:60px;height:60px;min-width:60px}
  .avatar-head{left:20px}
  .avatar-body{left:10px}
  .member-name{margin-left:14px;font-size:19px}
  .amount{font-size:19px}
  .total-amount{font-size:30px}
}
</style>
</head>

<body>

<div class="app">

<header>
  <div class="header-row">

    <button class="menu-btn">
      <div class="menu-icon">
        <span></span>
        <span></span>
        <span></span>
      </div>
    </button>

    <div>
      <div class="title">BALIPADA JATRA COMUNITY</div>
      <div class="subtitle">Monthly Money List</div>
    </div>

    <button class="notification-btn">
      <div class="bell"></div>
    </button>

  </div>
</header>

<div class="logo-wrap">
  <img src="./logo.png" alt="Logo">
</div>

<div class="month-box">
  <select id="monthSelect" class="month-select"></select>
  <div class="arrow"></div>
</div>

<div class="search-wrap">
  <input
    id="searchInput"
    class="search"
    type="search"
    placeholder="Search name..."
    autocomplete="off">
</div>

<main id="collectionList" class="collection-list">
  <div class="loading">Loading collection...</div>
</main>

<div class="total-box">
  <div class="total-label">TOTAL</div>
  <div id="totalAmount" class="total-amount">₹0</div>
</div>

<footer class="footer">
  Public View &nbsp; • &nbsp; Developed by Saroj
</footer>

</div>

<script>

/* ==========================================================
   YOUR GOOGLE SHEET
========================================================== */

const SHEET_ID =
"1AxAm7z3pv-p5x5iAOObnJ0AgHIp_kzIIyDvAbdSLFwY";

const SHEET_NAME = "Sheet1";

/*
   IMPORTANT:
   Your actual Sheet columns are:

   A = NAME
   B = MONTH
   C = AMOUNT
   D = YEAR
*/

const SHEET_URL =
"https://docs.google.com/spreadsheets/d/" +
SHEET_ID +
"/gviz/tq?tqx=out:json&sheet=" +
encodeURIComponent(SHEET_NAME);


/* ==========================================================
   START DATE
========================================================== */

const START_YEAR = 2026;
const START_MONTH = 6; // July


/* ==========================================================
   MONTHS
========================================================== */

const MONTHS = [
  "JANUARY",
  "FEBRUARY",
  "MARCH",
  "APRIL",
  "MAY",
  "JUNE",
  "JULY",
  "AUGUST",
  "SEPTEMBER",
  "OCTOBER",
  "NOVEMBER",
  "DECEMBER"
];


/* ==========================================================
   VARIABLES
========================================================== */

let data = [];
let selectedMonth = "";
let search = "";


/* ==========================================================
   ELEMENTS
========================================================== */

const monthSelect =
document.getElementById("monthSelect");

const searchInput =
document.getElementById("searchInput");

const list =
document.getElementById("collectionList");

const total =
document.getElementById("totalAmount");


/* ==========================================================
   GENERATE MONTHS
========================================================== */

function generateMonths(){

  monthSelect.innerHTML = "";

  const start =
  new Date(
    START_YEAR,
    START_MONTH,
    1
  );

  const now =
  new Date();

  const end =
  new Date(
    now.getFullYear(),
    now.getMonth(),
    1
  );

  let date =
  new Date(start);

  while(date <= end){

    const year =
    date.getFullYear();

    const month =
    date.getMonth();

    const option =
    document.createElement("option");

    option.value =
    year + "-" +
    String(month + 1).padStart(2,"0");

    option.textContent =
    MONTHS[month] +
    " " +
    year;

    monthSelect.appendChild(option);

    date.setMonth(
      date.getMonth() + 1
    );
  }

  /*
     Automatically select current month.

     Example:
     August 2026 = AUGUST 2026
  */

  const current =
  now.getFullYear() +
  "-" +
  String(
    now.getMonth() + 1
  ).padStart(2,"0");

  if(
    [...monthSelect.options]
    .some(o => o.value === current)
  ){
    selectedMonth = current;
  }else{
    selectedMonth =
    monthSelect.options[
      monthSelect.options.length - 1
    ].value;
  }

  monthSelect.value =
  selectedMonth;
}


/* ==========================================================
   NORMALIZE MONTH
========================================================== */

function normalizeMonth(value){

  const v =
  String(value || "")
  .trim()
  .toUpperCase();

  const map = {
    JAN:"JANUARY",
    JANUARY:"JANUARY",

    FEB:"FEBRUARY",
    FEBRUARY:"FEBRUARY",

    MAR:"MARCH",
    MARCH:"MARCH",

    APR:"APRIL",
    APRIL:"APRIL",

    MAY:"MAY",

    JUN:"JUNE",
    JUNE:"JUNE",

    JUL:"JULY",
    JULY:"JULY",

    AUG:"AUGUST",
    AUGUST:"AUGUST",

    SEP:"SEPTEMBER",
    SEPT:"SEPTEMBER",
    SEPTEMBER:"SEPTEMBER",

    OCT:"OCTOBER",
    OCTOBER:"OCTOBER",

    NOV:"NOVEMBER",
    NOVEMBER:"NOVEMBER",

    DEC:"DECEMBER",
    DECEMBER:"DECEMBER"
  };

  return map[v] || v;
}


/* ==========================================================
   GOOGLE VISUALIZATION RESPONSE
==========================================================

   This is the important fix.

   We don't use CSV parsing anymore.

   Google returns a JSON-like response through
   the Visualization API.
========================================================== */

function loadSheet(){

  list.innerHTML =
  '<div class="loading">Loading collection...</div>';

  const script =
  document.createElement("script");

  /*
     Cache breaker.
  */

  const callback =
  "googleSheetCallback_" +
  Date.now();

  window[callback] =
  function(response){

    try{

      if(
        !response ||
        !response.table
      ){
        throw new Error(
          "No Google Sheet data returned."
        );
      }

      const rows =
      response.table.rows || [];

      data = [];

      rows.forEach(row => {

        const cells =
        row.c || [];

        /*
           Exact columns from your Sheet:

           0 = NAME
           1 = MONTH
           2 = AMOUNT
           3 = YEAR
        */

        const name =
        cells[0]?.v ?? "";

        const month =
        cells[1]?.v ?? "";

        const amount =
        cells[2]?.v ?? 0;

        const year =
        cells[3]?.v ?? "";

        if(
          String(name).trim() === ""
        ){
          return;
        }

        data.push({

          name:
          String(name).trim(),

          month:
          normalizeMonth(month),

          amount:
          Number(
            String(amount)
            .replace(/[₹,\s]/g,"")
          ) || 0,

          year:
          Number(year)

        });

      });

      console.log(
        "Google Sheet data:",
        data
      );

      render();

    }
    catch(error){

      console.error(error);

      showError(
        "Google Sheet data could not be read."
      );

    }

    delete window[callback];

    script.remove();
  };


  script.src =
  SHEET_URL +
  "&callback=" +
  callback +
  "&t=" +
  Date.now();

  script.onerror =
  function(){

    showError(
      "Google Sheet connection failed."
    );

    delete window[callback];

    script.remove();
  };

  document.body.appendChild(script);
}


/* ==========================================================
   GET CURRENT MONTH DATA
========================================================== */

function getMonthData(){

  if(!selectedMonth){
    return [];
  }

  const parts =
  selectedMonth.split("-");

  const year =
  Number(parts[0]);

  const month =
  MONTHS[
    Number(parts[1]) - 1
  ];

  return data.filter(item => {

    return (
      item.year === year &&
      item.month === month
    );

  });
}


/* ==========================================================
   RENDER
========================================================== */

function render(){

  let rows =
  getMonthData();

  const q =
  search
  .trim()
  .toUpperCase();

  if(q){

    rows =
    rows.filter(item =>
      item.name
      .toUpperCase()
      .includes(q)
    );

  }

  const sum =
  rows.reduce(
    (a,b) =>
      a + Number(b.amount || 0),
    0
  );

  total.textContent =
  "₹" +
  sum.toLocaleString("en-IN");


  if(!rows.length){

    list.innerHTML =
    '<div class="empty">' +
    'NO COLLECTION DATA FOUND' +
    '</div>';

    return;
  }


  list.innerHTML =
  rows.map(item => {

    return `
      <div class="member-card">

        <div class="avatar">
          <div class="avatar-head"></div>
          <div class="avatar-body"></div>
        </div>

        <div class="member-name">
          ${escapeHTML(item.name)}
        </div>

        <div class="amount">
          ₹${Number(item.amount).toLocaleString("en-IN")}
        </div>

      </div>
    `;

  }).join("");
}


/* ==========================================================
   ERROR
========================================================== */

function showError(message){

  list.innerHTML =
  `
    <div class="error">
      <strong>Collection data unavailable</strong>
      ${message}
    </div>
  `;

  total.textContent = "₹0";
}


/* ==========================================================
   SECURITY
========================================================== */

function escapeHTML(value){

  return String(value)
  .replace(/&/g,"&amp;")
  .replace(/</g,"&lt;")
  .replace(/>/g,"&gt;")
  .replace(/"/g,"&quot;")
  .replace(/'/g,"&#039;");

}


/* ==========================================================
   MONTH CHANGE
========================================================== */

monthSelect.addEventListener(
  "change",
  function(){

    selectedMonth =
    this.value;

    render();

  }
);


/* ==========================================================
   SEARCH
========================================================== */

searchInput.addEventListener(
  "input",
  function(){

    search =
    this.value;

    render();

  }
);


/* ==========================================================
   START
========================================================== */

generateMonths();
loadSheet();


/*
   Refresh every 60 seconds.
   If you edit Sheet1, the site will
   pick up the new data automatically.
*/

setInterval(
  loadSheet,
  60000
);

</script>

</body>
</html>
