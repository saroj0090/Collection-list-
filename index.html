<html lang="en">
<head>

<style>

/* =========================================================
   RESET
========================================================= */

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    -webkit-tap-highlight-color: transparent;
}

:root {
    --purple: #651cff;
    --purple2: #8d20ff;
    --purple3: #a020ff;

    --dark: #252a3e;
    --muted: #777d91;

    --bg: #f8f7fc;
    --white: #ffffff;
}

html {
    width: 100%;
    min-height: 100%;
}

body {
    width: 100%;
    min-height: 100vh;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;

    background: var(--bg);
    color: var(--dark);
}

/* =========================================================
   APP
========================================================= */

.app {
    width: 100%;
    max-width: 560px;
    min-height: 100vh;

    margin: 0 auto;

    padding:
        18px
        18px
        35px;
}

/* =========================================================
   HEADER
========================================================= */

.header {
    width: 100%;
    text-align: center;
}

.header-row {
    width: 100%;
    min-height: 62px;

    display: flex;
    align-items: center;
    justify-content: center;

    position: relative;
}

/* MENU */

.menu-btn {
    position: absolute;
    left: 0;
    top: 3px;

    width: 50px;
    height: 50px;

    border: 0;
    background: transparent;

    display: flex;
    align-items: center;
    justify-content: center;
}

.menu-icon {
    width: 43px;
    height: 31px;

    display: flex;
    flex-direction: column;
    justify-content: space-between;
}

.menu-icon span {
    width: 100%;
    height: 6px;

    border-radius: 10px;

    background:
        linear-gradient(
            90deg,
            #651cff,
            #9822ff
        );
}

/* NOTIFICATION */

.notification-btn {
    position: absolute;
    right: 0;
    top: 3px;

    width: 50px;
    height: 50px;

    border: 0;
    background: transparent;

    display: flex;
    align-items: center;
    justify-content: center;
}

.bell {
    width: 30px;
    height: 31px;

    border: 4px solid var(--purple);

    border-radius:
        16px
        16px
        8px
        8px;

    position: relative;
}

.bell::after {
    content: "";

    position: absolute;

    width: 12px;
    height: 4px;

    border-radius: 5px;

    background: var(--purple);

    bottom: -9px;
    left: 50%;

    transform: translateX(-50%);
}

/* TITLE */

.title {
    max-width: calc(100vw - 120px);

    margin: 0 auto;

    color: #6520c9;

    font-size:
        clamp(20px, 5.8vw, 31px);

    font-weight: 800;

    line-height: 1.08;

    white-space: nowrap;
}

.subtitle {
    margin-top: 7px;

    color: var(--muted);

    font-size: 18px;

    font-weight: 600;
}

/* =========================================================
   LOGO
========================================================= */

.logo-wrap {
    width: 112px;
    height: 112px;

    margin:
        18px
        auto
        20px;

    padding: 5px;

    border-radius: 50%;

    background: #fff;

    border: 1px solid #eeeeF5;

    box-shadow:
        0 8px 28px rgba(100, 30, 220, 0.20),
        0 0 0 5px rgba(255,255,255,0.65);

    overflow: hidden;

    display: flex;
    align-items: center;
    justify-content: center;
}

.logo-wrap img {
    width: 100%;
    height: 100%;

    display: block;

    border-radius: 50%;

    object-fit: cover;
}

/* =========================================================
   MONTH SELECTOR
========================================================= */

.month-box {
    width: 100%;
    height: 94px;

    border-radius: 28px;

    background:
        linear-gradient(
            110deg,
            #5714d9 0%,
            #7018ed 45%,
            #9827ff 100%
        );

    box-shadow:
        0 15px 32px
        rgba(101, 28, 255, 0.23);

    display: flex;
    align-items: center;

    position: relative;

    overflow: hidden;
}

.month-select {
    width: 100%;
    height: 100%;

    padding:
        0 68px
        0 28px;

    border: none;
    outline: none;

    background: transparent;

    color: white;

    font-size:
        clamp(22px, 6vw, 29px);

    font-weight: 800;

    appearance: none;
    -webkit-appearance: none;

    cursor: pointer;
}

.month-select option {
    background: white;
    color: #252a3e;
}

.arrow {
    position: absolute;

    right: 29px;
    top: 34px;

    width: 25px;
    height: 25px;

    border-right: 6px solid white;
    border-bottom: 6px solid white;

    transform: rotate(45deg);

    pointer-events: none;
}

/* =========================================================
   SEARCH
========================================================= */

.search-wrap {
    margin-top: 18px;
    margin-bottom: 16px;
}

.search {
    width: 100%;
    height: 60px;

    padding: 0 20px;

    border:
        1px solid
        #e5e3ed;

    border-radius: 21px;

    outline: none;

    background: white;

    color: var(--dark);

    font-size: 18px;

    box-shadow:
        0 7px 22px
        rgba(35, 28, 70, 0.06);
}

.search::placeholder {
    color: #9da2b1;
}

.search:focus {
    border-color: #8d35ff;

    box-shadow:
        0 7px 24px
        rgba(101, 28, 255, 0.10);
}

/* =========================================================
   COLLECTION LIST
========================================================= */

.collection-list {
    width: 100%;

    display: flex;
    flex-direction: column;

    gap: 13px;
}

/* MEMBER */

.member-card {
    width: 100%;
    min-height: 94px;

    padding:
        12px
        18px
        12px
        15px;

    background: white;

    border-radius: 27px;

    display: flex;
    align-items: center;

    border:
        1px solid
        rgba(50, 40, 80, 0.035);

    box-shadow:
        0 7px 23px
        rgba(35, 28, 70, 0.08);

    transition:
        transform 0.15s ease,
        box-shadow 0.15s ease;
}

.member-card:active {
    transform: scale(0.985);
}

/* AVATAR */

.avatar {
    width: 66px;
    height: 66px;

    min-width: 66px;

    border-radius: 50%;

    background:
        linear-gradient(
            145deg,
            #7117ff,
            #9c27ff
        );

    position: relative;

    display: flex;
    align-items: center;
    justify-content: center;

    box-shadow:
        0 4px 12px
        rgba(101, 28, 255, 0.20);
}

.avatar-head {
    position: absolute;

    width: 20px;
    height: 20px;

    top: 12px;

    border-radius: 50%;

    background: white;
}

.avatar-body {
    position: absolute;

    width: 40px;
    height: 21px;

    bottom: 12px;

    border-radius:
        24px
        24px
        12px
        12px;

    background: white;
}

/* NAME */

.member-name {
    flex: 1;

    min-width: 0;

    margin-left: 19px;

    color: #252a3e;

    font-size:
        clamp(19px, 5.4vw, 25px);

    font-weight: 700;

    text-transform: uppercase;

    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}

/* AMOUNT */

.amount {
    margin-left: 10px;

    color: #252a3e;

    font-size:
        clamp(18px, 5vw, 24px);

    font-weight: 800;

    white-space: nowrap;
}

/* =========================================================
   LOADING
========================================================= */

.loading {
    width: 100%;

    text-align: center;

    padding:
        45px
        15px;

    color: #858b9d;

    font-size: 17px;

    font-weight: 600;
}

/* =========================================================
   EMPTY
========================================================= */

.empty {
    width: 100%;

    padding:
        45px
        20px;

    text-align: center;

    color: #858b9d;

    background: white;

    border-radius: 25px;

    font-size: 17px;

    font-weight: 600;

    box-shadow:
        0 7px 22px
        rgba(35, 28, 70, 0.05);
}

/* =========================================================
   ERROR
========================================================= */

.error-box {
    width: 100%;

    padding: 30px 20px;

    text-align: center;

    color: #777d91;

    background: white;

    border-radius: 25px;

    box-shadow:
        0 7px 22px
        rgba(35, 28, 70, 0.05);
}

.error-title {
    color: #651cff;

    font-size: 18px;

    font-weight: 800;

    margin-bottom: 8px;
}

/* =========================================================
   TOTAL
========================================================= */

.total-box {
    width: 100%;

    min-height: 88px;

    margin-top: 19px;

    padding:
        0 30px;

    border-radius: 46px;

    display: flex;
    align-items: center;
    justify-content: space-between;

    color: white;

    background:
        linear-gradient(
            110deg,
            #5c18df,
            #791df5,
            #982aff
        );

    box-shadow:
        0 15px 32px
        rgba(101, 28, 255, 0.24);
}

.total-label {
    font-size: 21px;
    font-weight: 800;
}

.total-amount {
    font-size: 35px;
    font-weight: 900;
}

/* =========================================================
   FOOTER
========================================================= */

.footer {
    margin-top: 30px;

    text-align: center;

    color: #73798d;

    font-size: 15px;

    font-weight: 600;
}

.footer span {
    margin: 0 7px;
}

/* =========================================================
   SMALL MOBILE
========================================================= */

@media (max-width: 390px) {

    .app {
        padding-left: 13px;
        padding-right: 13px;
    }

    .title {
        font-size: 20px;
    }

    .subtitle {
        font-size: 17px;
    }

    .logo-wrap {
        width: 100px;
        height: 100px;
    }

    .month-box {
        height: 88px;
        border-radius: 25px;
    }

    .month-select {
        font-size: 22px;
        padding-left: 24px;
    }

    .arrow {
        right: 25px;
    }

    .member-card {
        min-height: 88px;
        padding-right: 14px;
    }

    .avatar {
        width: 60px;
        height: 60px;
        min-width: 60px;
    }

    .member-name {
        margin-left: 14px;
        font-size: 19px;
    }

    .amount {
        font-size: 19px;
    }

    .total-box {
        min-height: 84px;
        padding: 0 27px;
    }

    .total-amount {
        font-size: 30px;
    }
}

/* =========================================================
   DESKTOP
========================================================= */

@media (min-width: 600px) {

    body {
        background:
            linear-gradient(
                135deg,
                #f5f3fb,
                #eeeaff
            );
    }

    .app {
        padding-top: 30px;
        padding-bottom: 50px;
    }
}

</style>
</head>
