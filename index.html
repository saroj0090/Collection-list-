<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>BALIPADA JATRA COMUNITY</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    -webkit-tap-highlight-color: transparent;
}

:root {
    --purple: #651cff;
    --purple2: #8b22ff;
    --dark: #20243a;
    --muted: #747b91;
    --bg: #f8f7fc;
}

body {
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;

    background: var(--bg);
    color: var(--dark);
    min-height: 100vh;
}

.app {
    width: 100%;
    max-width: 520px;
    margin: 0 auto;
    min-height: 100vh;
    padding: 18px 20px 30px;
}

/* =========================
   HEADER
========================= */

.header {
    position: relative;
    text-align: center;
    padding-top: 8px;
}

.header-row {
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    min-height: 55px;
}

.menu-btn,
.notification-btn {
    position: absolute;
    top: 5px;
    width: 52px;
    height: 52px;
    border: 0;
    background: transparent;
    display: flex;
    align-items: center;
    justify-content: center;
}

.menu-btn {
    left: 0;
}

.notification-btn {
    right: 0;
}

.menu-icon {
    width: 44px;
    height: 32px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
}

.menu-icon span {
    display: block;
    height: 6px;
    border-radius: 10px;
    background: var(--purple);
}

.bell {
    width: 29px;
    height: 29px;
    border: 4px solid var(--purple);
    border-radius: 15px 15px 8px 8px;
    position: relative;
}

.bell::after {
    content: "";
    position: absolute;
    width: 10px;
    height: 4px;
    border-radius: 5px;
    background: var(--purple);
    bottom: -8px;
    left: 50%;
    transform: translateX(-50%);
}

.title {
    color: #6520c9;
    font-size: clamp(22px, 6vw, 31px);
    font-weight: 800;
    line-height: 1.1;
    white-space: nowrap;
}

.subtitle {
    margin-top: 7px;
    color: var(--muted);
    font-size: 18px;
    font-weight: 600;
}

/* =========================
   LOGO
========================= */

.logo-wrap {
    width: 108px;
    height: 108px;
    margin: 20px auto 18px;

    border-radius: 50%;
    overflow: hidden;

    background: #fff;

    border: 6px solid #fff;

    box-shadow:
        0 8px 25px rgba(100, 30, 220, 0.20),
        0 0 0 1px rgba(100, 30, 220, 0.06);

    display: flex;
    align-items: center;
    justify-content: center;
}

.logo-wrap img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
}

/* =========================
   MONTH SELECTOR
========================= */

.month-box {
    width: 100%;
    height: 94px;

    border-radius: 27px;

    background:
        linear-gradient(
            110deg,
            #5714d9 0%,
            #7218ee 50%,
            #8c28ff 100%
        );

    box-shadow:
        0 15px 30px rgba(101, 28, 255, 0.22);

    display: flex;
    align-items: center;
    justify-content: space-between;

    padding: 0 27px;

    color: white;
}

.month-select {
    flex: 1;
    height: 100%;
    border: none;
    outline: none;
    background: transparent;
    color: white;

    font-size: 28px;
    font-weight: 800;

    appearance: none;
    -webkit-appearance: none;

    cursor: pointer;
}

.month-select option {
    color: #20243a;
    background: white;
}

.arrow {
    width: 22px;
    height: 22px;

    border-right: 5px solid white;
    border-bottom: 5px solid white;

    transform: rotate(45deg);
    margin-right: 7px;
    margin-top: -10px;

    pointer-events: none;
}

/* =========================
   SEARCH
========================= */

.search-wrap {
    margin-top: 18px;
    margin-bottom: 15px;
}

.search {
    width: 100%;
    height: 58px;

    border: 1px solid #e5e4ec;
    border-radius: 20px;

    background: white;

    padding: 0 20px;

    font-size: 17px;
    outline: none;

    color: var(--dark);

    box-shadow:
        0 6px 20px rgba(30, 25, 70, 0.05);
}

.search::placeholder {
    color: #9ba0b0;
}

.search:focus {
    border-color: #8b45ff;
}

/* =========================
   COLLECTION LIST
========================= */

.collection-list {
    display: flex;
    flex-direction: column;
    gap: 13px;
}

.member-card {
    min-height: 94px;

    background: white;

    border-radius: 27px;

    display: flex;
    align-items: center;

    padding: 12px 22px 12px 16px;

    box-shadow:
        0 7px 22px rgba(35, 28, 70, 0.08);

    border: 1px solid rgba(50, 40, 80, 0.035);

    transition:
        transform 0.15s ease,
        box-shadow 0.15s ease;
}

.member-card:active {
    transform: scale(0.985);
}

.avatar {
    width: 66px;
    height: 66px;

    flex: 0 0 66px;

    border-radius: 50%;

    background:
        linear-gradient(
            145deg,
            #7518ff,
            #9a28ff
        );

    display: flex;
    align-items: center;
    justify-content: center;

    position: relative;
}

.avatar-head {
    position: absolute;

    width: 20px;
    height: 20px;

    border-radius: 50%;

    background: white;

    top: 13px;
}

.avatar-body {
    position: absolute;

    width: 39px;
    height: 20px;

    border-radius: 25px 25px 12px 12px;

    background: white;

    bottom: 13px;
}

.member-name {
    margin-left: 20px;

    flex: 1;

    font-size: 24px;
    font-weight: 700;

    color: #252a3e;

    text-transform: uppercase;

    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}

.amount {
    font-size: 23px;
    font-weight: 800;
    color: #252a3e;

    white-space: nowrap;
}

/* =========================
   EMPTY
========================= */

.empty {
    text-align: center;

    background: white;

    border-radius: 25px;

    padding: 45px 20px;

    color: #8a90a2;

    font-size: 18px;
    font-weight: 600;

    box-shadow:
        0 7px 22px rgba(35, 28, 70, 0.05);
}

/* =========================
   TOTAL
========================= */

.total-box {
    margin-top: 18px;

    min-height: 88px;

    border-radius: 45px;

    padding: 0 30px;

    display: flex;
    align-items: center;
    justify-content: space-between;

    color: white;

    background:
        linear-gradient(
            110deg,
            #5d18df,
            #7a1df5,
            #8c2cff
        );

    box-shadow:
        0 14px 30px rgba(101, 28, 255, 0.24);
}

.total-label {
    font-size: 20px;
    font-weight: 800;
}

.total-amount {
    font-size: 34px;
    font-weight: 900;
}

/* =========================
   FOOTER
========================= */

.footer {
    text-align: center;

    margin-top: 30px;

    color: #73798d;

    font-size: 15px;
    font-weight: 600;
}

.footer span {
    margin: 0 8px;
}

/* =========================
   LOADING
========================= */

.loading {
    text-align: center;
    padding: 40px 10px;
    color: #858b9d;
    font-weight: 600;
}

/* =========================
   DESKTOP
========================= */

@media (min-width: 600px) {

    body {
        background:
            linear-gradient(
                135deg,
                #f5f3fb,
                #eeeaff
            );
    }

    .app {
        padding-top: 35px;
        padding-bottom: 50px;
    }

}

/* =========================
   SMALL MOBILE
========================= */

@media (max-width: 380px) {

    .app {
        padding-left: 14px;
        padding-right: 14px;
    }

    .title {
        font-size: 21px;
    }

    .month-select {
        font-size: 22px;
    }

    .member-card {
        padding-right: 15px;
    }

    .member-name {
        font-size: 20px;
        margin-left: 14px;
    }

    .amount {
        font-size: 19px;
    }

    .avatar {
        width: 60px;
        height: 60px;
        flex-basis: 60px;
    }

    .total-amount {
        font-size: 28px;
    }
}
</style>
</head>

<script>

/* ==========================================================
   GOOGLE SHEET CONNECTION
   ==========================================================

   IMPORTANT:
   Keep your existing Google Sheet connection here.

   If your current website already has a working Google
   Sheet URL/API, put that SAME URL below.

   DO NOT put the visual/design code inside this section.

   Expected data columns:

   Name | Amount | Month

   Example:

   Lucky bhaina | 300 | July
   Batu bhai    | 300 | July
   Saroj        | 300 | July

========================================================== */

const GOOGLE_SHEET_CONFIG = {

    /*
       OPTION 1:
       Put your existing CSV/API URL here.

       Example:

       CSV_URL:
       "https://docs.google.com/spreadsheets/d/....../gviz/tq?tqx=out:csv&sheet=Sheet1"

       Keep your existing working URL if you already have one.
    */

    CSV_URL: "",

    /*
       Sheet name.
       Your sheet is Sheet1.
    */

    SHEET_NAME: "Sheet1"

};


/* ==========================================================
   COLLECTION SETTINGS
========================================================== */

/*
   COLLECTION START DATE

   July 2026 is the permanent starting point.

   The website will NEVER show:
   January 2026
   February 2026
   March 2026
   April 2026
   May 2026
   June 2026

   It starts at July 2026.
*/

const COLLECTION_START_YEAR = 2026;
const COLLECTION_START_MONTH = 6;
// JavaScript month:
// 0 = January
// 6 = July


/* ==========================================================
   VARIABLES
========================================================== */

let allData = [];

let selectedMonth = "";

let currentDisplayedData = [];


/* ==========================================================
   MONTH NAMES
========================================================== */

const MONTH_NAMES = [
    "JANUARY",
    "FEBRUARY",
    "MARCH",
    "APRIL",
    "MAY",
    "JUNE",
    "JULY",
    "AUGUST",
    "SEPTEMBER",
    "OCTOBER",
    "NOVEMBER",
    "DECEMBER"
];


/* ==========================================================
   GENERATE VALID MONTHS
   JULY 2026 → CURRENT MONTH
========================================================== */

function generateMonths() {

    const select = document.getElementById("monthSelect");

    select.innerHTML = "";

    const startDate = new Date(
        COLLECTION_START_YEAR,
        COLLECTION_START_MONTH,
        1
    );

    const now = new Date();

    /*
       IMPORTANT:

       End date is CURRENT MONTH.

       Therefore if today is:

       August 2026

       available months are:

       JULY 2026
       AUGUST 2026

       NOT:

       SEPTEMBER 2026
       OCTOBER 2026
       etc.
    */

    const endDate = new Date(
        now.getFullYear(),
        now.getMonth(),
        1
    );


    let date = new Date(startDate);


    while (date <= endDate) {

        const year = date.getFullYear();
        const month = date.getMonth();

        const value =
            year + "-" +
            String(month + 1).padStart(2, "0");

        const text =
            MONTH_NAMES[month] +
            " " +
            year;


        const option =
            document.createElement("option");

        option.value = value;
        option.textContent = text;

        select.appendChild(option);


        date.setMonth(date.getMonth() + 1);
    }


    /*
       Automatically select CURRENT MONTH.

       Example:

       August 2026 → AUGUST 2026

       January 2027 → JANUARY 2027
    */

    const currentValue =
        now.getFullYear() +
        "-" +
        String(now.getMonth() + 1).padStart(2, "0");


    /*
       If current month is before July 2026,
       use July 2026.

       This also makes the code safe for future changes.
    */

    if (select.querySelector(
        `option[value="${currentValue}"]`
    )) {

        selectedMonth = currentValue;

    } else {

        selectedMonth =
            select.options[
                select.options.length - 1
            ]?.value || "";

    }


    select.value = selectedMonth;

}


/* ==========================================================
   NORMALIZE MONTH
========================================================== */

function normalizeMonth(value) {

    if (!value) return "";

    let month = String(value)
        .trim()
        .toUpperCase();


    const monthMap = {

        JAN: "JANUARY",
        JANUARY: "JANUARY",

        FEB: "FEBRUARY",
        FEBRUARY: "FEBRUARY",

        MAR: "MARCH",
        MARCH: "MARCH",

        APR: "APRIL",
        APRIL: "APRIL",

        MAY: "MAY",

        JUN: "JUNE",
        JUNE: "JUNE",

        JUL: "JULY",
        JULY: "JULY",

        AUG: "AUGUST",
        AUGUST: "AUGUST",

        SEP: "SEPTEMBER",
        SEPT: "SEPTEMBER",
        SEPTEMBER: "SEPTEMBER",

        OCT: "OCTOBER",
        OCTOBER: "OCTOBER",

        NOV: "NOVEMBER",
        NOVEMBER: "NOVEMBER",

        DEC: "DECEMBER",
        DECEMBER: "DECEMBER"

    };

    return monthMap[month] || month;
}


/* ==========================================================
   MONTH NUMBER
========================================================== */

function getMonthNumber(monthName) {

    const month = normalizeMonth(monthName);

    return MONTH_NAMES.indexOf(month);

}


/* ==========================================================
   PARSE GOOGLE SHEET DATA
========================================================== */

function parseCSV(text) {

    const rows = [];

    let row = [];
    let cell = "";
    let insideQuotes = false;


    for (let i = 0; i < text.length; i++) {

        const char = text[i];
        const next = text[i + 1];


        if (char === '"' && insideQuotes && next === '"') {

            cell += '"';

            i++;

        }

        else if (char === '"') {

            insideQuotes = !insideQuotes;

        }

        else if (char === "," && !insideQuotes) {

            row.push(cell.trim());
            cell = "";

        }

        else if (
            (char === "\n" || char === "\r")
            && !insideQuotes
        ) {

            if (cell !== "" || row.length > 0) {

                row.push(cell.trim());

                rows.push(row);

                row = [];
                cell = "";

            }

        }

        else {

            cell += char;

        }

    }


    if (cell !== "" || row.length > 0) {

        row.push(cell.trim());

        rows.push(row);

    }


    return rows;

}


/* ==========================================================
   CONVERT SHEET DATA
========================================================== */

function convertRows(rows) {

    if (!rows || rows.length < 2) {
        return [];
    }


    const headers = rows[0].map(
        h => String(h).trim().toLowerCase()
    );


    const nameIndex =
        headers.indexOf("name");

    const amountIndex =
        headers.indexOf("amount");

    const monthIndex =
        headers.indexOf("month");


    /*
       If the Sheet doesn't have the expected headers,
       try first three columns.
    */

    const nIndex =
        nameIndex >= 0 ? nameIndex : 0;

    const aIndex =
        amountIndex >= 0 ? amountIndex : 1;

    const mIndex =
        monthIndex >= 0 ? monthIndex : 2;


    const result = [];


    for (let i = 1; i < rows.length; i++) {

        const row = rows[i];

        if (!row || row.length === 0) {
            continue;
        }


        const name =
            String(row[nIndex] || "").trim();

        const amountText =
            String(row[aIndex] || "")
                .replace(/[₹,\s]/g, "");


        const amount =
            Number(amountText) || 0;


        const month =
            normalizeMonth(row[mIndex]);


        if (!name || !month) {
            continue;
        }


        result.push({

            name: name,
            amount: amount,
            month: month

        });

    }


    return result;

}


/* ==========================================================
   LOAD GOOGLE SHEET
========================================================== */

async function loadGoogleSheet() {

    /*
       Keep Google Sheet connection separate.

       If CSV_URL is empty, show a helpful message
       instead of breaking the design.
    */

    if (!GOOGLE_SHEET_CONFIG.CSV_URL) {

        allData = [];

        renderCollection();

        return;

    }


    try {

        const response =
            await fetch(
                GOOGLE_SHEET_CONFIG.CSV_URL +
                (
                    GOOGLE_SHEET_CONFIG.CSV_URL.includes("?")
                    ? "&"
                    : "?"
                ) +
                "_=" +
                Date.now()
            );


        if (!response.ok) {

            throw new Error(
                "Google Sheet connection failed"
            );

        }


        const text =
            await response.text();


        const rows =
            parseCSV(text);


        allData =
            convertRows(rows);


        renderCollection();


    }

    catch (error) {

        console.error(error);

        allData = [];

        document.getElementById(
            "collectionList"
        ).innerHTML = `
            <div class="empty">
                Unable to load collection data.
                <br><br>
                Please check the Google Sheet connection.
            </div>
        `;

        document.getElementById(
            "totalAmount"
        ).textContent = "₹0";

    }

}


/* ==========================================================
   GET DATA FOR SELECTED MONTH
========================================================== */

function getSelectedMonthData() {

    if (!selectedMonth) {
        return [];
    }


    const parts =
        selectedMonth.split("-");


    const year =
        Number(parts[0]);

    const monthNumber =
        Number(parts[1]);


    /*
       Exa
