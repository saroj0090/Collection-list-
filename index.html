<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>BALIPADA JATRA COMUNITY</title>

<style>

/* =========================================================
   RESET
========================================================= */

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    -webkit-tap-highlight-color: transparent;
}

:root {
    --purple: #6417e8;
    --purple2: #921dff;
    --purple3: #b42cff;

    --text: #25283d;
    --muted: #777d91;

    --background: #f8f7fc;
    --white: #ffffff;

    --shadow: 0 8px 25px rgba(42, 25, 85, 0.09);
    --purple-shadow: 0 15px 35px rgba(100, 23, 232, 0.25);
}

html {
    min-height: 100%;
}

body {
    min-height: 100vh;
    background: var(--background);

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;

    color: var(--text);
}

/* =========================================================
   MAIN APP
========================================================= */

.app {
    width: 100%;
    max-width: 520px;

    min-height: 100vh;

    margin: auto;

    padding:
        18px
        20px
        35px;
}

/* =========================================================
   HEADER
========================================================= */

.header {
    position: relative;
    width: 100%;
}

.header-row {
    position: relative;

    min-height: 82px;

    display: flex;
    align-items: flex-start;
    justify-content: center;

    text-align: center;

    padding-top: 5px;
}

/* MENU */

.menu-btn {
    position: absolute;

    left: -3px;
    top: 8px;

    width: 55px;
    height: 55px;

    border: none;
    background: transparent;

    display: flex;
    align-items: center;
    justify-content: center;
}

.menu-icon {
    width: 45px;
    height: 34px;

    display: flex;
    flex-direction: column;
    justify-content: space-between;
}

.menu-icon span {
    width: 45px;
    height: 6px;

    border-radius: 10px;

    background:
        linear-gradient(
            90deg,
            var(--purple),
            var(--purple3)
        );
}

/* NOTIFICATION */

.notification-btn {
    position: absolute;

    right: -3px;
    top: 8px;

    width: 55px;
    height: 55px;

    border: none;
    background: transparent;

    display: flex;
    align-items: center;
    justify-content: center;
}

.bell {
    width: 31px;
    height: 32px;

    border: 4px solid var(--purple);

    border-radius:
        18px
        18px
        9px
        9px;

    position: relative;
}

.bell::before {
    content: "";

    position: absolute;

    left: 50%;
    bottom: -8px;

    transform: translateX(-50%);

    width: 12px;
    height: 4px;

    border-radius: 10px;

    background: var(--purple);
}

/* TITLE */

.title {
    color: #651ac7;

    font-size:
        clamp(
            21px,
            5.7vw,
            31px
        );

    font-weight: 800;

    line-height: 1.1;

    white-space: nowrap;
}

.subtitle {
    margin-top: 8px;

    color: var(--muted);

    font-size: 18px;

    font-weight: 600;
}

/* =========================================================
   LOGO
========================================================= */

.logo-wrap {
    width: 110px;
    height: 110px;

    margin:
        5px
        auto
        25px;

    border-radius: 50%;

    overflow: hidden;

    background: #ffffff;

    border: 6px solid #ffffff;

    box-shadow:
        0 8px 30px rgba(101, 28, 255, 0.23),
        0 0 0 1px rgba(101, 28, 255, 0.08);

    position: relative;
}

.logo-wrap img {
    width: 100%;
    height: 100%;

    display: block;

    object-fit: cover;
}

/* =========================================================
   MONTH SELECTOR
========================================================= */

.month-box {
    width: 100%;

    height: 94px;

    border-radius: 28px;

    background:
        linear-gradient(
            110deg,
            #5914d8 0%,
            #7116ef 48%,
            #a026ff 100%
        );

    box-shadow: var(--purple-shadow);

    position: relative;

    display: flex;
    align-items: center;

    overflow: hidden;
}

.month-select {
    width: 100%;
    height: 100%;

    border: none;
    outline: none;

    background: transparent;

    color: #ffffff;

    padding:
        0
        75px
        0
        30px;

    font-size:
        clamp(
            22px,
            6vw,
            28px
        );

    font-weight: 800;

    appearance: none;
    -webkit-appearance: none;

    cursor: pointer;
}

.month-select option {
    color: #222438;
    background: white;
}

/* ARROW */

.arrow {
    position: absolute;

    right: 32px;
    top: 31px;

    width: 25px;
    height: 25px;

    border-right: 6px solid white;
    border-bottom: 6px solid white;

    transform: rotate(45deg);

    pointer-events: none;
}

/* =========================================================
   SEARCH
========================================================= */

.search-wrap {
    margin-top: 18px;
    margin-bottom: 18px;
}

.search {
    width: 100%;
    height: 62px;

    border-radius: 22px;

    border: 1px solid #e4e2eb;

    outline: none;

    background: white;

    color: var(--text);

    padding:
        0
        21px;

    font-size: 18px;

    box-shadow:
        0 7px 22px rgba(35, 28, 70, 0.06);
}

.search::placeholder {
    color: #999eae;
}

.search:focus {
    border-color: #8b32ff;
}

/* =========================================================
   COLLECTION LIST
========================================================= */

.collection-list {
    width: 100%;

    display: flex;

    flex-direction: column;

    gap: 13px;
}

/* MEMBER CARD */

.member-card {
    width: 100%;

    min-height: 96px;

    background: white;

    border-radius: 27px;

    padding:
        13px
        20px
        13px
        15px;

    display: flex;

    align-items: center;

    box-shadow: var(--shadow);

    border: 1px solid rgba(50, 40, 80, 0.035);

    transition:
        transform 0.15s ease,
        box-shadow 0.15s ease;

    animation: cardIn 0.25s ease both;
}

.member-card:active {
    transform: scale(0.985);
}

@keyframes cardIn {

    from {
        opacity: 0;
        transform: translateY(8px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }
}

/* AVATAR */

.avatar {
    width: 66px;
    height: 66px;

    flex: 0 0 66px;

    border-radius: 50%;

    background:
        linear-gradient(
            145deg,
            #7418ff,
            #a329ff
        );

    position: relative;
}

/* PERSON ICON */

.avatar-head {
    position: absolute;

    width: 21px;
    height: 21px;

    border-radius: 50%;

    background: white;

    top: 13px;
    left: 50%;

    transform: translateX(-50%);
}

.avatar-body {
    position: absolute;

    width: 40px;
    height: 21px;

    border-radius:
        25px
        25px
        12px
        12px;

    background: white;

    bottom: 12px;
    left: 50%;

    transform: translateX(-50%);
}

/* NAME */

.member-name {
    flex: 1;

    min-width: 0;

    margin-left: 20px;

    font-size:
        clamp(
            19px,
            5.2vw,
            24px
        );

    font-weight: 700;

    color: #252a3e;

    text-transform: uppercase;

    overflow: hidden;

    text-overflow: ellipsis;

    white-space: nowrap;
}

/* AMOUNT */

.amount {
    margin-left: 8px;

    font-size:
        clamp(
            19px,
            5vw,
            23px
        );

    font-weight: 800;

    color: #252a3e;

    white-space: nowrap;
}

/* =========================================================
   EMPTY / ERROR
========================================================= */

.empty {
    width: 100%;

    text-align: center;

    background: white;

    border-radius: 27px;

    padding: 45px 20px;

    color: #8a90a2;

    font-size: 17px;

    font-weight: 600;

    box-shadow: var(--shadow);
}

.loading {
    text-align: center;

    padding: 45px 10px;

    color: #858b9d;

    font-size: 18px;

    font-weight: 600;
}

/* =========================================================
   TOTAL
========================================================= */

.total-box {
    width: 100%;

    min-height: 90px;

    margin-top: 20px;

    border-radius: 48px;

    padding:
        0
        30px;

    display: flex;

    align-items: center;

    justify-content: space-between;

    color: white;

    background:
        linear-gradient(
            110deg,
            #5d18df,
            #7c1df6,
            #982bff
        );

    box-shadow: var(--purple-shadow);
}

.total-label {
    font-size: 21px;

    font-weight: 800;
}

.total-amount {
    font-size: 35px;

    font-weight: 900;

    white-space: nowrap;
}

/* =========================================================
   FOOTER
========================================================= */

.footer {
    text-align: center;

    margin-top: 30px;

    color: #73798d;

    font-size: 15px;

    font-weight: 600;
}

.footer span {
    margin: 0 6px;
}

/* =========================================================
   RESPONSIVE
========================================================= */

@media (max-width: 380px) {

    .app {
        padding-left: 14px;
        padding-right: 14px;
    }

    .title {
        font-size: 20px;
    }

    .subtitle {
        font-size: 17px;
    }

    .logo-wrap {
        width: 100px;
        height: 100px;
    }

    .month-box {
        height: 88px;
    }

    .member-card {
        min-height: 88px;
        padding-right: 14px;
    }

    .avatar {
        width: 60px;
        height: 60px;
        flex-basis: 60px;
    }

    .member-name {
        margin-left: 14px;
    }

    .total-amount {
        font-size: 29px;
    }
}

</style>
</head>

<script>

/* =========================================================
   GOOGLE SHEET CONNECTION
   =========================================================

   YOUR GOOGLE SHEET ID
========================================================= */

const GOOGLE_SHEET_CONFIG = {

    SHEET_ID:
        "1AxAm7z3pv-p5x5iAOObnJ0AgHIp_kzIIyDvAbdSLFwY",

    SHEET_NAME:
        "Sheet1"

};


/* =========================================================
   BUILD GOOGLE SHEET CSV URL
========================================================= */

function getSheetCSVUrl() {

    return (
        "https://docs.google.com/spreadsheets/d/" +
        GOOGLE_SHEET_CONFIG.SHEET_ID +
        "/gviz/tq?tqx=out:csv&sheet=" +
        encodeURIComponent(
            GOOGLE_SHEET_CONFIG.SHEET_NAME
        )
    );

}


/* =========================================================
   COLLECTION START
=========================================================

   July 2026

   JavaScript months:

   January = 0
   February = 1
   ...
   July = 6
========================================================= */

const START_YEAR = 2026;
const START_MONTH = 6;


/* =========================================================
   GLOBAL VARIABLES
========================================================= */

let allData = [];

let selectedMonth = "";

let searchText = "";


/* =========================================================
   MONTH NAMES
========================================================= */

const MONTH_NAMES = [

    "JANUARY",
    "FEBRUARY",
    "MARCH",
    "APRIL",
    "MAY",
    "JUNE",
    "JULY",
    "AUGUST",
    "SEPTEMBER",
    "OCTOBER",
    "NOVEMBER",
    "DECEMBER"

];


/* =========================================================
   MONTH SELECTOR
========================================================= */

function generateMonths() {

    const select =
        document.getElementById(
            "monthSelect"
        );

    select.innerHTML = "";


    const startDate =
        new Date(
            START_YEAR,
            START_MONTH,
            1
        );


    const today =
        new Date();


    /*
       CURRENT MONTH ONLY.

       Example:

       August 2026:

       JULY 2026
       AUGUST 2026

       September is NOT shown yet.
    */

    const currentDate =
        new Date(
            today.getFullYear(),
            today.getMonth(),
            1
        );


    let date =
        new Date(startDate);


    /*
       Safety:
       If current date is before our start date,
       only show July 2026.
    */

    if (currentDate < startDate) {

        currentDate.setTime(
            startDate.getTime()
        );

    }


    while (date <= currentDate) {

        const year =
            date.getFullYear();

        const month =
            date.getMonth();


        const value =
            year +
            "-" +
            String(
                month + 1
            ).padStart(2, "0");


        const text =
            MONTH_NAMES[month] +
            " " +
            year;


        const option =
            document.createElement(
                "option"
            );


        option.value =
            value;

        option.textContent =
            text;


        select.appendChild(
            option
        );


        date.setMonth(
            date.getMonth() + 1
        );

    }


    /*
       Automatically select current month.

       August 2026
       → AUGUST 2026

       January 2027
       → JANUARY 2027
    */

    const currentValue =
        today.getFullYear() +
        "-" +
        String(
            today.getMonth() + 1
        ).padStart(2, "0");


    const currentOption =
        select.querySelector(
            `option[value="${currentValue}"]`
        );


    if (currentOption) {

        select.value =
            currentValue;

    }

    else {

        select.selectedIndex =
            select.options.length - 1;

    }


    selectedMonth =
        select.value;

}


/* =========================================================
   MONTH SELECT CHANGE
========================================================= */

document
    .getElementById("monthSelect")
    .addEventListener(
        "change",
        function () {

            selectedMonth =
                this.value;

            renderCollection();

        }
    );


/* =========================================================
   SEARCH CHANGE
========================================================= */

document
    .getElementById("searchInput")
    .addEventListener(
        "input",
        function () {

            searchText =
                this.value
                    .trim()
                    .toLowerCase();

            renderCollection();

        }
    );


/* =========================================================
   NORMALIZE TEXT
========================================================= */

function cleanText(value) {

    return String(
        value ?? ""
    )
    .trim()
    .replace(/\s+/g, " ");

}


/* =========================================================
   NORMALIZE MONTH
========================================================= */

function normalizeMonth(value) {

    const text =
        cleanText(value)
            .toUpperCase();


    const map = {

        JAN: "JANUARY",
        JANUARY: "JANUARY",

        FEB: "FEBRUARY",
        FEBRUARY: "FEBRUARY",

        MAR: "MARCH",
        MARCH: "MARCH",

        APR: "APRIL",
        APRIL: "APRIL",

        MAY: "MAY",

        JUN: "JUNE",
        JUNE: "JUNE",

        JUL: "JULY",
        JULY: "JULY",

        AUG: "AUGUST",
        AUGUST: "AUGUST",

        SEP: "SEPTEMBER",
        SEPT: "SEPTEMBER",
        SEPTEMBER: "SEPTEMBER",

        OCT: "OCTOBER",
        OCTOBER: "OCTOBER",

        NOV: "NOVEMBER",
        NOVEMBER: "NOVEMBER",

        DEC: "DECEMBER",
        DECEMBER: "DECEMBER"

    };


    return map[text] || text;

}


/* =========================================================
   MONTH NUMBER
========================================================= */

function getMonthNumber(month) {

    return MONTH_NAMES.indexOf(
        normalizeMonth(month)
    );

}


/* =========================================================
   CSV PARSER
========================================================= */

function parseCSV(text) {

    const rows = [];

    let row = [];
    let cell = "";

    let insideQuotes = false;


    for (
        let i = 0;
        i < text.length;
        i++
    ) {

        const char =
            text[i];

        const next =
            text[i + 1];


        if (
            char === '"' &&
            insideQuotes &&
            next === '"'
        ) {

            cell += '"';

            i++;

        }

        else if (
            char === '"'
        ) {

            insideQuotes =
                !insideQuotes;

        }
