<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#ffffff">
<title>BALIPADA JATRA COMMUNITY</title>

<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}

body{
  margin:0;
  background:#f7f7fb;
  color:#202641;
  font-family:Arial,Helvetica,sans-serif
}

.app{
  width:100%;
  max-width:520px;
  min-height:100vh;
  margin:auto;
  padding:15px 16px 28px
}

/* HEADER */
.topbar{
  display:grid;
  grid-template-columns:50px 1fr 50px;
  align-items:center;
  min-height:78px
}

.icon-btn{
  width:46px;
  height:46px;
  border:0;
  background:transparent;
  display:grid;
  place-items:center
}

.hamburger{
  width:27px;
  display:flex;
  flex-direction:column;
  gap:5px
}

.hamburger span{
  height:4px;
  background:#5b16d9;
  border-radius:5px
}

.bell{
  width:23px;
  height:23px;
  border:3px solid #5b16d9;
  border-radius:14px 14px 6px 6px;
  position:relative
}

.bell:after{
  content:"";
  position:absolute;
  bottom:-7px;
  left:50%;
  transform:translateX(-50%);
  width:9px;
  height:4px;
  background:#5b16d9;
  border-radius:5px
}

.brand{text-align:center}

.brand h1{
  margin:0;
  color:#5315d1;
  font-size:23px;
  font-weight:900;
  white-space:nowrap
}

.brand p{
  margin:7px 0 0;
  color:#747b95;
  font-size:15px;
  font-weight:700
}

/* LOGO */
.logo-wrap{
  display:flex;
  justify-content:center;
  margin-bottom:10px
}

.logo{
  width:65px;
  height:65px;
  object-fit:cover;
  border-radius:50%;
  border:4px solid white;
  box-shadow:0 8px 25px rgba(80,20,180,.2)
}

/* MONTH */
.month-box{
  position:relative;
  margin:8px 0 20px
}

#monthSelect{
  width:100%;
  border:0;
  outline:none;
  appearance:none;
  padding:17px 55px 17px 22px;
  border-radius:18px;
  background:linear-gradient(110deg,#4610b7,#7b2cff);
  color:white;
  font-size:18px;
  font-weight:900;
  box-shadow:0 10px 24px rgba(91,22,217,.25)
}

.chevron{
  position:absolute;
  right:23px;
  top:50%;
  width:13px;
  height:13px;
  border-right:3px solid white;
  border-bottom:3px solid white;
  transform:translateY(-70%) rotate(45deg);
  pointer-events:none
}

/* MEMBERS */
.list{
  display:flex;
  flex-direction:column;
  gap:8px
}

.member{
  min-height:68px;
  padding:9px 17px 9px 10px;
  background:#fff;
  border-radius:18px;
  display:flex;
  align-items:center;
  gap:13px;
  border:1px solid #eeeeF5;
  box-shadow:0 3px 10px rgba(33,25,70,.06)
}

.avatar{
  width:48px;
  height:48px;
  flex:0 0 48px;
  border-radius:50%;
  background:linear-gradient(145deg,#7b2cff,#4610b7);
  display:grid;
  place-items:center
}

.person{
  width:25px;
  height:25px;
  position:relative
}

.person:before{
  content:"";
  position:absolute;
  width:11px;
  height:11px;
  border-radius:50%;
  background:#fff;
  left:7px;
  top:1px
}

.person:after{
  content:"";
  position:absolute;
  width:23px;
  height:11px;
  border-radius:13px 13px 5px 5px;
  background:#fff;
  left:1px;
  bottom:1px
}

.name{
  flex:1;
  min-width:0;
  font-size:17px;
  font-weight:850;
  text-transform:uppercase;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis
}

.amount{
  font-size:18px;
  font-weight:900;
  white-space:nowrap
}

/* MESSAGE */
.message{
  padding:40px 20px;
  text-align:center;
  color:#8188a0;
  background:#fff;
  border:1px dashed #d9d9e8;
  border-radius:24px;
  font-weight:800
}

.message small{
  display:block;
  margin-top:9px;
  color:#a0a5b7
}

/* TOTAL */
.total{
  margin-top:18px;
  min-height:86px;
  padding:15px 23px;
  border-radius:44px;
  background:linear-gradient(110deg,#4610b7,#7b2cff);
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:space-between;
  box-shadow:0 13px 28px rgba(91,22,217,.25)
}

.total-label{
  font-size:19px;
  font-weight:900
}

.total-value{
  font-size:40px;
  font-weight:950;
  white-space:nowrap
}

/* FOOTER */
.footer{
  padding:25px 5px 4px;
  display:flex;
  justify-content:center;
  align-items:center;
  gap:12px;
  color:#747b95;
  font-size:15px;
  font-weight:700
}

.dot{
  width:5px;
  height:5px;
  border-radius:50%;
  background:#aaa
}

/* MOBILE */
@media(max-width:380px){
  .app{padding-left:11px;padding-right:11px}
  .brand h1{font-size:20px}
  .brand p{font-size:14px}
  .name{font-size:15px}
  .amount{font-size:16px}
  .total-value{font-size:32px}
}
</style>
</head>

<body>

<div class="app">

<header class="topbar">

<button class="icon-btn">
  <span class="hamburger">
    <span></span>
    <span></span>
    <span></span>
  </span>
</button>

<div class="brand">
  <h1>BALIPADA JATRA COMMUNITY</h1>
  <p>Monthly Money List</p>
</div>

<button class="icon-btn">
  <span class="bell"></span>
</button>

</header>

<div class="logo-wrap">
  <img src="logo.png" class="logo" alt="Community Logo">
</div>

<div class="month-box">
<select id="monthSelect"></select>
<span class="chevron"></span>
</div>

<div id="list" class="list">
<div class="message">LOADING COLLECTION DATA...</div>
</div>

<div class="total">
<span class="total-label">TOTAL</span>
<span id="totalValue" class="total-value">₹0</span>
</div>

<footer class="footer">
<span>Public View</span>
<span class="dot"></span>
<span>Developed by Saroj</span>
</footer>

</div>

<script>

/* =====================================================
   GOOGLE SHEET CONNECTION
   ===================================================== */

const CONFIG = {

  spreadsheetId:
  "1AxAm7z3pv-p5x5iAOObnJ0AgHIp_kzIIyDvAbdSLFwY",

  sheetName:
  "Sheet1",

  autoRefresh:true,

  refreshMs:60000

};


/* =====================================================
   MONTHS
   ===================================================== */

const MONTHS=[
"JANUARY",
"FEBRUARY",
"MARCH",
"APRIL",
"MAY",
"JUNE",
"JULY",
"AUGUST",
"SEPTEMBER",
"OCTOBER",
"NOVEMBER",
"DECEMBER"
];


const monthSelect=
document.getElementById("monthSelect");

const list=
document.getElementById("list");

const totalValue=
document.getElementById("totalValue");

let allRows=[];
let selectedMonth="";


/* =====================================================
   MONTH NORMALIZATION
   ===================================================== */

function normalizeMonth(value){

  if(!value)return "";

  let m=String(value)
    .trim()
    .toLowerCase();

  const aliases={

    jan:"JANUARY",
    january:"JANUARY",

    feb:"FEBRUARY",
    february:"FEBRUARY",

    mar:"MARCH",
    march:"MARCH",

    apr:"APRIL",
    april:"APRIL",

    may:"MAY",

    jun:"JUNE",
    june:"JUNE",

    jul:"JULY",
    july:"JULY",

    aug:"AUGUST",
    august:"AUGUST",

    sep:"SEPTEMBER",
    sept:"SEPTEMBER",
    september:"SEPTEMBER",

    oct:"OCTOBER",
    october:"OCTOBER",

    nov:"NOVEMBER",
    november:"NOVEMBER",

    dec:"DECEMBER",
    december:"DECEMBER"
  };

  if(aliases[m])
    return aliases[m];

  for(const month of MONTHS){

    if(m.includes(month.toLowerCase()))
      return month;

  }

  return m.toUpperCase();
}


/* =====================================================
   CSV PARSER
   ===================================================== */

function parseCSV(text){

  const rows=[];
  let row=[];
  let cell="";
  let quoted=false;

  for(let i=0;i<text.length;i++){

    const char=text[i];
    const next=text[i+1];

    if(char==='"' && quoted && next==='"'){

      cell+='"';
      i++;

    }

    else if(char==='"'){

      quoted=!quoted;

    }

    else if(char==="," && !quoted){

      row.push(cell);
      cell="";

    }

    else if((char==="\n" || char==="\r") && !quoted){

      if(char==="\r" && next==="\n")i++;

      row.push(cell);
      cell="";

      if(row.some(v=>String(v).trim()!==""))
        rows.push(row);

      row=[];

    }

    else{

      cell+=char;

    }

  }

  row.push(cell);

  if(row.some(v=>String(v).trim()!==""))
    rows.push(row);

  return rows;
}


/* =====================================================
   GOOGLE SHEET DATA
   ===================================================== */

function cleanHeader(value){

  return String(value||"")
    .trim()
    .toLowerCase()
    .replace(/[\s_-]+/g,"");

}


function parseAmount(value){

  const cleaned=String(value||"")
    .replace(/[₹,\s]/g,"")
    .replace(/[^\d.-]/g,"");

  const number=Number(cleaned);

  return Number.isFinite(number)?number:0;

}


function csvToObjects(csv){

  const rows=parseCSV(csv);

  if(!rows.length)
    return [];

  const headers=
    rows[0].map(cleanHeader);

  const nameIndex=
    headers.findIndex(h=>
      ["name","member","membername"].includes(h)
    );

  const amountIndex=
    headers.findIndex(h=>
      ["amount","money","collection","value"].includes(h)
    );

  const monthIndex=
    headers.findIndex(h=>
      ["month","months"].includes(h)
    );

  if(
    nameIndex===-1 ||
    amountIndex===-1 ||
    monthIndex===-1
  ){

    throw new Error(
      "Sheet1 must contain NAME, AMOUNT and MONTH columns."
    );

  }

  return rows.slice(1).map(row=>({

    name:String(row[nameIndex]||"").trim(),

    amount:parseAmount(row[amountIndex]),

    month:normalizeMonth(row[monthIndex])

  })).filter(row=>row.name);

}


/* =====================================================
   FORMAT MONEY
   ===================================================== */

function money(value){

  return "₹"+Number(value||0)
    .toLocaleString("en-IN",{
      maximumFractionDigits:0
    });

}


/* =====================================================
   MONTH DROPDOWN
   ===================================================== */

function populateMonths(){

  monthSelect.innerHTML="";

  MONTHS.forEach(month=>{

    const option=
      document.createElement("option");

    option.value=month;

    option.textContent=
      month+" "+new Date().getFullYear();

    monthSelect.appendChild(option);

  });

  const current=
    MONTHS[new Date().getMonth()];

  const available=
    new Set(allRows.map(row=>row.month));

  if(available.has(current)){

    selectedMonth=current;

  }else if(available.size){

    let last=-1;

    available.forEach(m=>{

      const index=MONTHS.indexOf(m);

      if(index>last)last=index;

    });

    selectedMonth=
      last>=0 ? MONTHS[last] : current;

  }else{

    selectedMonth=current;

  }

  monthSelect.value=selectedMonth;

}


/* =====================================================
   DISPLAY DATA
   ===================================================== */

function render(){

  const filtered=
    allRows.filter(row=>
      normalizeMonth(row.month)===
      normalizeMonth(selectedMonth)
    );

  list.innerHTML="";

  if(!filtered.length){

    list.innerHTML=`
      <div class="message">
        NO COLLECTION DATA FOUND
        <small>
          Check the MONTH value in Sheet1.
        </small>
      </div>
    `;

    totalValue.textContent="₹0";

    return;
  }

  let total=0;

  filtered.forEach(row=>{

    total+=Number(row.amount)||0;

    const member=
      document.createElement("div");

    member.className="member";

    member.innerHTML=`

      <div class="avatar">
        <span class="person"></span>
      </div>

      <div class="name"></div>

      <div class="amount"></div>

    `;

    member.querySelector(".name")
      .textContent=
      row.name.toUpperCase();

    member.querySelector(".amount")
      .textContent=
      money(row.amount);

    list.appendChild(member);

  });

  totalValue.textContent=
    money(total);

}


/* =====================================================
   LOAD GOOGLE SHEET
   ===================================================== */

async function loadSheet(){

  list.innerHTML=`
    <div class="message">
      LOADING COLLECTION DATA...
    </div>
  `;

  try{

    const url=
      "https://docs.google.com/spreadsheets/d/"+
      encodeURIComponent(CONFIG.spreadsheetId)+
      "/gviz/tq?tqx=out:csv&sheet="+
      encodeURIComponent(CONFIG.sheetName);

    const response=
      await fetch(url,{cache:"no-store"});

    if(!response.ok)
      throw new Error("Google Sheet error");

    const csv=
      await response.text();

    allRows=
      csvToObjects(csv);

    populateMonths();

    render();

  }catch(error){

    console.error(error);

    list.innerHTML=`
      <div class="message">
        UNABLE TO LOAD COLLECTION DATA
        <small>
          Check Google Sheet sharing and
          NAME, AMOUNT, MONTH columns.
        </small>
      </div>
    `;

    totalValue.textContent="₹0";

  }

}


/* =====================================================
   MONTH CHANGE
   ===================================================== */

monthSelect.addEventListener(
  "change",
  function(){

    selectedMonth=this.value;

    render();

  }
);


/* =====================================================
   START
   ===================================================== */

loadSheet();


/* AUTO UPDATE EVERY 60 SECONDS */

if(CONFIG.autoRefresh){

  setInterval(
    loadSheet,
    CONFIG.refreshMs
  );

}

</script>

</body>
</html>
