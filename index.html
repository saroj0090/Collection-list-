<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Monthly Money List</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f5f6f8;color:#202124;font-family:Arial,Helvetica,sans-serif}
.page{max-width:720px;margin:auto;padding:18px 14px 40px}
.header{background:#fff;border-radius:12px;padding:20px;margin-bottom:14px;box-shadow:0 2px 8px #00000012}
h1{margin:0;font-size:25px}
.subtitle{margin:7px 0 0;color:#70757a;font-size:14px}
.month{margin-top:18px;width:100%;padding:11px;border:1px solid #dadce0;border-radius:8px;font-size:16px;background:#fff}
.card{background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 2px 8px #00000012}
table{width:100%;border-collapse:collapse}
th{background:#f8f9fa;color:#5f6368;text-align:left;font-size:13px;font-weight:700;padding:13px 14px;border-bottom:1px solid #e0e0e0}
th:last-child,td:last-child{text-align:right}
td{padding:13px 14px;border-bottom:1px solid #eee;font-size:15px}
.amount{font-weight:600}
.total td{font-weight:700;font-size:16px;background:#fafafa;border-top:2px solid #ddd}
.footer{text-align:center;color:#80868b;font-size:12px;margin-top:15px}
@media(max-width:450px){.page{padding:10px}.header{padding:16px}h1{font-size:22px}td,th{padding:12px 10px}}
</style>
</head>
<body>
<div class="page">
  <div class="header">
    <h1>Monthly Money List</h1>
    <p class="subtitle">Public view — anyone with this link can see the list</p>
    <select class="month" id="month">
      <option value="july">July 2026</option>
      <option value="august">August 2026</option>
    </select>
  </div>

  <div class="card">
    <table>
      <thead>
        <tr><th>Name</th><th>Amount</th></tr>
      </thead>
      <tbody id="list"></tbody>
      <tfoot>
        <tr class="total"><td>Total</td><td id="total">₹0</td></tr>
      </tfoot>
    </table>
  </div>
  <div class="footer">Last updated list • Public view</div>
</div>

<script>
const data={
  july:[
    ["Lucky bhaina",300],
    ["Batu bhai",300],
    ["Saroj",300],
    ["Deepak bhai",300],
    ["Daku",300],
    ["Dsm",300],
    ["Akhu",300],
    ["Bapi",300],
    ["Lipa bhaina",300]
  ],
  august:[]
};

function money(n){
  return new Intl.NumberFormat("en-IN",{style:"currency",currency:"INR",maximumFractionDigits:0}).format(n);
}
function render(){
  const rows=data[document.getElementById("month").value]||[];
  document.getElementById("list").innerHTML=rows.map(x=>
    `<tr><td>${escapeHtml(x[0])}</td><td class="amount">${money(x[1])}</td></tr>`
  ).join("");
  document.getElementById("total").textContent=money(rows.reduce((s,x)=>s+Number(x[1]),0));
}
function escapeHtml(s){
  return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
}
document.getElementById("month").addEventListener("change",render);
render();
</script>
</body>
</html>
