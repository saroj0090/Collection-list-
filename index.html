<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0,
      maximum-scale=1.0, user-scalable=no">

<title>BALIPADA JATRA COMMUNITY</title>


<style>

/* ==========================================================
   ARGLE FONT
========================================================== */

@font-face {
    font-family: "Argle";

    src: url("./Argle-Regular.ttf")
         format("truetype");

    font-weight: normal;
    font-style: normal;

    font-display: swap;
}


/* ==========================================================
   RESET
========================================================== */

* {
    box-sizing: border-box;

    margin: 0;
    padding: 0;

    -webkit-tap-highlight-color: transparent;
}


/* ==========================================================
   COLORS
========================================================== */

:root {

    --purple: #6817ee;

    --dark: #252a3e;

    --muted: #777d91;

    --bg: #f8f7fc;

    --green: #159447;

}


/* ==========================================================
   BODY
========================================================== */

html,
body {

    width: 100%;

    min-height: 100%;

}


body {

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;

    background: var(--bg);

    color: var(--dark);

}


/* ==========================================================
   APP
========================================================== */

.app {

    width: 100%;

    max-width: 560px;

    min-height: 100vh;

    margin: 0 auto;

    padding: 18px 16px 35px;

}


/* ==========================================================
   HEADER
========================================================== */

.header {

    width: 100%;

}


.header-row {

    min-height: 70px;

    display: flex;

    align-items: center;

    justify-content: center;

    text-align: center;

}


/* ==========================================================
   COMMUNITY TITLE
========================================================== */

.title {

    font-family: "Argle", sans-serif;

    color: #ff0000;

    font-size:
        clamp(21px, 5.8vw, 31px);

    font-weight: normal;

    line-height: 1.12;

    white-space: nowrap;

}


/* ==========================================================
   SUBTITLE
========================================================== */

.subtitle {

    margin-top: 7px;

    color: var(--muted);

    font-size: 18px;

    font-weight: 600;

}


/* ==========================================================
   LOGO
========================================================== */

.logo-wrap {

    width: 108px;

    height: 108px;

    margin: 20px auto 25px;

    padding: 5px;

    background: #fff;

    border: 1px solid
        rgba(100,30,220,.08);

    border-radius: 50%;

    overflow: hidden;

    box-shadow:

        0 8px 28px
        rgba(100,30,220,.20),

        0 0 0 1px
        rgba(100,30,220,.05);

    display: flex;

    align-items: center;

    justify-content: center;

}


.logo-wrap img {

    width: 100%;

    height: 100%;

    object-fit: cover;

    border-radius: 50%;

    display: block;

}


/* ==========================================================
   MONTH SELECTOR
========================================================== */

.month-box {

    width: 100%;

    height: 94px;

    position: relative;

    overflow: hidden;

    border-radius: 28px;

    background:

        linear-gradient(
            110deg,
            #5714d9 0%,
            #7418f0 50%,
            #9827ff 100%
        );

    box-shadow:

        0 15px 32px
        rgba(101,28,255,.24);

}


.month-select {

    width: 100%;

    height: 100%;

    padding:
        0 70px 0 28px;

    border: 0;

    outline: none;

    background: transparent;

    color: white;

    font-size:
        clamp(22px, 6vw, 29px);

    font-weight: 800;

    appearance: none;

    -webkit-appearance: none;

    cursor: pointer;

}


.month-select option {

    background: white;

    color: #252a3e;

}


.arrow {

    position: absolute;

    right: 29px;

    top: 32px;

    width: 25px;

    height: 25px;

    border-right: 6px solid white;

    border-bottom: 6px solid white;

    transform: rotate(45deg);

    pointer-events: none;

}


/* ==========================================================
   SEARCH
========================================================== */

.search-wrap {

    margin: 18px 0 16px;

}


.search {

    width: 100%;

    height: 60px;

    padding: 0 20px;

    border: 1px solid #e4e2ec;

    border-radius: 21px;

    outline: none;

    background: white;

    color: var(--dark);

    font-size: 18px;

    box-shadow:

        0 7px 22px
        rgba(35,28,70,.06);

}


.search::placeholder {

    color: #9da2b1;

}


.search:focus {

    border-color: #8a38ff;

}


/* ==========================================================
   COLLECTION LIST
========================================================== */

.collection-list {

    display: flex;

    flex-direction: column;

    gap: 13px;

}


.member-card {

    min-height: 94px;

    width: 100%;

    padding:
        12px 18px 12px 15px;

    background: white;

    border-radius: 27px;

    display: flex;

    align-items: center;

    box-shadow:

        0 7px 23px
        rgba(35,28,70,.08);

    border: 1px solid
        rgba(50,40,80,.035);

    transition:
        transform .15s ease;

}


.member-card:active {

    transform: scale(.985);

}


/* ==========================================================
   AVATAR
========================================================== */

.avatar {

    width: 66px;

    height: 66px;

    min-width: 66px;

    position: relative;

    border-radius: 50%;

    background:

        linear-gradient(
            145deg,
            #7117ff,
            #9c27ff
        );

}


.avatar-head {

    position: absolute;

    width: 20px;

    height: 20px;

    top: 12px;

    left: 23px;

    border-radius: 50%;

    background: #fff;

}


.avatar-body {

    position: absolute;

    width: 40px;

    height: 21px;

    left: 13px;

    bottom: 12px;

    border-radius:
        24px 24px 12px 12px;

    background: #fff;

}


/* ==========================================================
   MEMBER NAME
========================================================== */

.member-name {

    flex: 1;

    min-width: 0;

    margin-left: 18px;

    color: #252a3e;

    font-size:
        clamp(19px,5.2vw,25px);

    font-weight: 700;

    text-transform: uppercase;

    overflow: hidden;

    text-overflow: ellipsis;

    white-space: nowrap;

}


/* ==========================================================
   AMOUNT
========================================================== */

.amount {

    margin-left: 10px;

    color: #252a3e;

    font-size:
        clamp(18px,5vw,24px);

    font-weight: 800;

    white-space: nowrap;

}


/* ==========================================================
   LOADING / EMPTY / ERROR
========================================================== */

.loading,
.empty,
.error {

    width: 100%;

    background: white;

    border-radius: 25px;

    padding: 42px 20px;

    text-align: center;

    color: #858b9d;

    font-size: 18px;

    font-weight: 600;

    box-shadow:

        0 7px 22px
        rgba(35,28,70,.05);

}


.error strong {

    display: block;

    margin-bottom: 10px;

    color: #651cff;

}


/* ==========================================================
   MONTHLY COLLECTED
========================================================== */

.summary-box {

    margin-top: 20px;

    padding: 8px 4px 0;

    display: flex;

    align-items: center;

    justify-content: space-between;

}


.summary-label {

    color: #252a3e;

    font-size: 19px;

    font-weight: 700;

    letter-spacing: .2px;

}


.summary-amount {

    color: #252a3e;

    font-size: 25px;

    font-weight: 800;

}


/* ==========================================================
   OVERALL TOTAL
========================================================== */

.overall-total {

    margin-top: 8px;

    padding: 5px 4px 0;

    display: flex;

    align-items: center;

    justify-content: space-between;

}


.overall-total-label {

    color: var(--green);

    font-size: 22px;

    font-weight: 800;

    letter-spacing: .2px;

}


.overall-total-amount {

    color: var(--green);

    font-size: 31px;

    font-weight: 900;

}


/* ==========================================================
   FOOTER
========================================================== */

.footer {

    margin-top: 30px;

    text-align: center;

    color: #73798d;

    font-size: 15px;

    font-weight: 600;

}


/* ==========================================================
   SMALL MOBILE
========================================================== */

@media(max-width:400px) {

    .app {

        padding-left: 13px;

        padding-right: 13px;

    }


    .title {

        font-size: 20px;

    }


    .subtitle {

        font-size: 17px;

    }


    .logo-wrap {

        width: 100px;

        height: 100px;

    }


    .month-box {

        height: 88px;

    }


    .member-card {

        min-height: 88px;

        padding-right: 14px;

    }


    .avatar {

        width: 60px;

        height: 60px;

        min-width: 60px;

    }


    .avatar-head {

        left: 20px;

    }


    .avatar-body {

        left: 10px;

    }


    .member-name {

        margin-left: 14px;

        font-size: 19px;

    }


    .amount {

        font-size: 19px;

    }


    .summary-label {

        font-size: 17px;

    }


    .summary-amount {

        font-size: 23px;

    }


    .overall-total-label {

        font-size: 20px;

    }


    .overall-total-amount {

        font-size: 28px;

    }

}

</style>

</head>


<body>


<div class="app">


    <!-- ======================================================
         HEADER
    ======================================================= -->

    <header class="header">

        <div class="header-row">

            <div>

                <div class="title">
                    BALIPADA JATRA COMMUNITY
                </div>

                <div class="subtitle">
                    Monthly Money List
                </div>

            </div>

        </div>

    </header>


    <!-- ======================================================
         LOGO
    ======================================================= -->

    <div class="logo-wrap">

        <img
            src="./logo.png"
            alt="Balipada Jatra Community Logo"
            onerror="this.style.display='none';">

    </div>


    <!-- ======================================================
         MONTH
    ======================================================= -->

    <div class="month-box">

        <select
            id="monthSelect"
            class="month-select">
        </select>

        <div class="arrow"></div>

    </div>


    <!-- ======================================================
         SEARCH
    ======================================================= -->

    <div class="search-wrap">

        <input
            id="searchInput"
            class="search"
            type="search"
            placeholder="Search name..."
            autocomplete="off">

    </div>


    <!-- ======================================================
         COLLECTION
    ======================================================= -->

    <main
        id="collectionList"
        class="collection-list">

        <div class="loading">
            Loading collection...
        </div>

    </main>


    <!-- ======================================================
         MONTHLY COLLECTED
    ======================================================= -->

    <div class="summary-box">

        <div class="summary-label">
            COLLECTED
        </div>

        <div
            id="monthlyAmount"
            class="summary-amount">

            ₹0

        </div>

    </div>


    <!-- ======================================================
         OVERALL TOTAL
    ======================================================= -->

    <div class="overall-total">

        <div class="overall-total-label">
            TOTAL
        </div>

        <div
            id="overallTotalAmount"
            class="overall-total-amount">

            ₹0

        </div>

    </div>


    <!-- ======================================================
         FOOTER
    ======================================================= -->

    <footer class="footer">

        Public View
        &nbsp; • &nbsp;
        Developed by Saroj

    </footer>


</div>


<script>

/* ==========================================================
   GOOGLE SHEET CONNECTION
========================================================== */

const SHEET_ID =
"1AxAm7z3pv-p5x5iAOObnJ0AgHIp_kzIIyDvAbdSLFwY";


const SHEET_NAME =
"Sheet1";


/*
    SHEET COLUMNS

    A = NAME
    B = MONTH
    C = AMOUNT
    D = YEAR
*/


/* ==========================================================
   COLLECTION START
========================================================== */

const START_YEAR = 2026;


/*
    JavaScript:

    January = 0
    February = 1
    March = 2
    April = 3
    May = 4
    June = 5
    July = 6
*/

const START_MONTH = 6;


/* ==========================================================
   MONTH NAMES
========================================================== */

const MONTH_NAMES = [

    "JANUARY",
    "FEBRUARY",
    "MARCH",
    "APRIL",
    "MAY",
    "JUNE",
    "JULY",
    "AUGUST",
    "SEPTEMBER",
    "OCTOBER",
    "NOVEMBER",
    "DECEMBER"

];


/* ==========================================================
   VARIABLES
========================================================== */

let allData = [];

let selectedMonth = "";

let searchText = "";


/* ==========================================================
   ELEMENTS
========================================================== */

const monthSelect =
    document.getElementById(
        "monthSelect"
    );


const searchInput =
    document.getElementById(
        "searchInput"
    );


const collectionList =
    document.getElementById(
        "collectionList"
    );


const monthlyAmount =
    document.getElementById(
        "monthlyAmount"
    );


const overallTotalAmount =
    document.getElementById(
        "overallTotalAmount"
    );


/* ==========================================================
   GENERATE MONTHS

   JULY 2026 → CURRENT MONTH

   Example:
   If current month is August 2026:

   JULY 2026
   AUGUST 2026

   It will NOT show future months.
========================================================== */

function generateMonths() {

    monthSelect.innerHTML = "";


    const startDate =
        new Date(
            START_YEAR,
            START_MONTH,
            1
        );


    const now =
        new Date();


    const currentMonthDate =
        new Date(
            now.getFullYear(),
            now.getMonth(),
            1
        );


    let date =
        new Date(startDate);


    while (
        date <= currentMonthDate
    ) {

        const year =
            date.getFullYear();


        const month =
            date.getMonth();


        const option =
            document.createElement(
                "option"
            );


        option.value =
            year +
            "-" +
            String(
                month + 1
            ).padStart(
                2,
                "0"
            );


        option.textContent =
            MONTH_NAMES[month] +
            " " +
            year;


        monthSelect.appendChild(
            option
        );


        date.setMonth(
            date.getMonth() + 1
        );

    }


    /*
        Automatically select
        current month.
    */

    const currentValue =
        now.getFullYear() +
        "-" +
        String(
            now.getMonth() + 1
        ).padStart(
            2,
            "0"
        );


    const currentOption =
        [...monthSelect.options]
        .find(
            option =>
                option.value ===
                currentValue
        );


    if (currentOption) {

        selectedMonth =
            currentValue;

    }

    else {

        selectedMonth =
            monthSelect
                .options[
                    monthSelect
                        .options.length - 1
                ]?.value || "";

    }


    monthSelect.value =
        selectedMonth;

}


/* ==========================================================
   NORMALIZE MONTH
========================================================== */

function normalizeMonth(value) {

    const month =
        String(
            value || ""
        )
        .trim()
        .toUpperCase();


    const map = {

        JAN:
        "JANUARY",

        JANUARY:
        "JANUARY",

        FEB:
        "FEBRUARY",

        FEBRUARY:
        "FEBRUARY",

        MAR:
        "MARCH",

        MARCH:
        "MARCH",

        APR:
        "APRIL",

        APRIL:
        "APRIL",

        MAY:
        "MAY",

        JUN:
        "JUNE",

        JUNE:
        "JUNE",

        JUL:
        "JULY",

        JULY:
        "JULY",

        AUG:
        "AUGUST",

        AUGUST:
        "AUGUST",

        SEP:
        "SEPTEMBER",

        SEPT:
        "SEPTEMBER",

        SEPTEMBER:
        "SEPTEMBER",

        OCT:
        "OCTOBER",

        OCTOBER:
        "OCTOBER",

        NOV:
        "NOVEMBER",

        NOVEMBER:
        "NOVEMBER",

        DEC:
        "DECEMBER",

        DECEMBER:
        "DECEMBER"

    };


    return map[month] || month;

}


/* ==========================================================
   LOAD GOOGLE SHEET
========================================================== */

function loadGoogleSheet() {

    collectionList.innerHTML = `
        <div class="loading">
            Loading collection...
        </div>
    `;


    const callbackName =
        "sheetCallback_" +
        Date.now();


    window[callbackName] =
        function(response) {

            try {

                if (
                    !response ||
                    !response.table
                ) {

                    throw new Error(
                        "Google Sheet returned no data."
                    );

                }


                const rows =
                    response.table.rows || [];


                allData = [];


                rows.forEach(
                    function(row) {

                        const cells =
                            row.c || [];


                        /*
                            A = NAME
                        */

                        const name =
                            cells[0]?.v ??
                            "";


                        /*
                            B = MONTH
                        */

                        const month =
                            cells[1]?.v ??
                            "";


                        /*
                            C = AMOUNT
                        */

                        const amountValue =
                            cells[2]?.v ??
                            0;


                        /*
                            D = YEAR
                        */

                        const yearValue =
                            cells[3]?.v ??
                            "";


                        if (
                            String(name)
                                .trim() === ""
                        ) {

                            return;

                        }


                        const amount =
                            Number(
                                String(
                                    amountValue
                                )
                                .replace(
                                    /[₹,\s]/g,
                                    ""
                                )
                            ) || 0;


                        const year =
                            Number(
                                String(
                                    yearValue
                                ).trim()
                            );


                        allData.push({

                            name:
                                String(
                                    name
                                ).trim(),

                            month:
                                normalizeMonth(
                                    month
                                ),

                            amount:
                                amount,

                            year:
                                year

                        });

                    }
                );


                console.log(
                    "Google Sheet data:",
                    allData
                );


                renderCollection();

            }

            catch (error) {

                console.error(
                    "Google Sheet error:",
                    error
                );


                showError(
                    "Unable to read Sheet1 data."
                );

            }


            delete window[
                callbackName
            ];

        };


    const sheetURL =
        "https://docs.google.com/spreadsheets/d/" +
        SHEET_ID +
        "/gviz/tq" +
        "?sheet=" +
        encodeURIComponent(
            SHEET_NAME
        ) +
        "&tqx=out:json;" +
        "responseHandler:" +
        callbackName +
        "&t=" +
        Date.now();


    const script =
        document.createElement(
            "script"
        );


    script.src =
        sheetURL;


    script.onerror =
        function() {

            console.error(
                "Google Sheet connection failed."
            );


            showError(
                "Google Sheet connection failed. Check that Sheet1 is shared as Anyone with the link → Viewer."
            );


            delete window[
                callbackName
            ];

        };


    document.body.appendChild(
        script
    );

}


/* ==========================================================
   GET SELECTED MONTH DATA
========================================================== */

function getSelectedMonthData() {

    if (!selectedMonth) {

        return [];

    }


    const parts =
        selectedMonth.split("-");


    const selectedYear =
        Number(parts[0]);


    const selectedMonthNumber =
        Number(parts[1]);


    const selectedMonthName =
        MONTH_NAMES[
            selectedMonthNumber - 1
        ];


    return allData.filter(
        function(item) {

            return (

                item.year ===
                selectedYear

                &&

                item.month ===
                selectedMonthName

            );

        }
    );

}


/* ==========================================================
   GET OVERALL COLLECTION

   IMPORTANT:

   TOTAL means ALL COLLECTIONS

   from:

   JULY 2026

   through the currently selected month.

   Example:

   July = ₹1000
   August = ₹1800
   September = ₹2000

   TOTAL = ₹4800
========================================================== */

function getOverallTotal() {

    if (!selectedMonth) {

        return 0;

    }


    const parts =
        selectedMonth.split("-");


    const selectedYear =
        Number(parts[0]);


    const selectedMonthNumber =
        Number(parts[1]);


    let total = 0;


    allData.forEach(
        function(item) {

            if (
                !item.year ||
                item.year < START_YEAR
            ) {

                return;

            }


            /*
                Ignore anything
                before July 2026.
            */

            if (
                item.year ===
                START_YEAR
                &&
                getMonthNumber(
                    item.month
                ) < START_MONTH
            ) {

                return;

            }


            /*
                Ignore future data
                after selected month.
            */

            if (
                item.year >
                selectedYear
            ) {

                return;

            }


            if (
                item.year ===
                selectedYear
                &&
                getMonthNumber(
                    item.month
                ) >
                selectedMonthNumber - 1
            ) {

                return;

            }


            total +=
                Number(
                    item.amount || 0
                );

        }
    );


    return total;

}


/* ==========================================================
   MONTH NUMBER
========================================================== */

function getMonthNumber(month) {

    return MONTH_NAMES.indexOf(
        normalizeMonth(month)
    );

}


/* ==========================================================
   RENDER COLLECTION
========================================================== */

function renderCollection() {

    let rows =
        getSelectedMonthData();


    /*
        SEARCH
    */

    const search =
        searchText
            .trim()
            .toUpperCase();


    if (search) {

        rows =
            rows.filter(
                function(item) {

                    return item.name
                        .toUpperCase()
                        .includes(search);

                }
            );

    }


    /*
        MONTHLY COLLECTION

        This is only the
        selected month's amount.
    */

    const monthTotal =
        getSelectedMonthData()
            .reduce(
                function(sum, item) {

                    return (
                        sum +
                        Number(
                            item.amount || 0
                        )
                    );

                },
                0
            );


    monthlyAmount.textContent =
        "₹" +
        monthTotal.toLocaleString(
            "en-IN"
        );


    /*
        OVERALL TOTAL

        July 2026 → selected month
    */

    const overallTotal =
        getOverallTotal();


    overallTotalAmount.textContent =
        "₹" +
        overallTotal.toLocaleString(
            "en-IN"
        );


    /*
        EMPTY
    */

    if (rows.length === 0) {

        collectionList.innerHTML = `

            <div class="empty">

                NO COLLECTION DATA FOUND

            </div>

        `;

        return;

    }


    /*
        MEMBER CARDS
    */

    collectionList.innerHTML =
        rows.map(
            function(item) {

                return `

                <div class="member-card">

                    <div class="avatar">

                        <div
                            class="avatar-head">
                        </div>

                        <div
                            class="avatar-body">
                        </div>

                    </div>


                    <div
                        class="member-name">

                        ${escapeHTML(
                            item.name
                        )}

                    </div>


                    <div
                        class="amount">

                        ₹${Number(
                            item.amount
                        ).toLocaleString(
                            "en-IN"
                        )}

                    </div>

                </div>

                `;

            }
        ).join("");

}


/* ==========================================================
   ERROR
========================================================== */

function showError(message) {

    collectionList.innerHTML = `

        <div class="error">

            <strong>
                COLLECTION DATA UNAVAILABLE
            </strong>

            ${escapeHTML(message)}

        </div>

    `;


    monthlyAmount.textContent =
        "₹0";


    overallTotalAmount.textContent =
        "₹0";

}


/* ==========================================================
   ESCAPE HTML
========================================================== */

function escapeHTML(value) {

    return String(value)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}


/* ==========================================================
   MONTH CHANGE
========================================================== */

monthSelect.addEventListener(
    "change",
    function() {

        selectedMonth =
            this.value;

        renderCollection();

    }
);


/* ==========================================================
   SEARCH
========================================================== */

searchInput.addEventListener(
    "input",
    function() {

        searchText =
            this.value;

        renderCollection();

    }
);


/* ==========================================================
   START
========================================================== */

generateMonths();

loadGoogleSheet();


/*
    Refresh Google Sheet
    every 60 seconds.
*/

setInterval(
    loadGoogleSheet,
    60000
);

</script>


</body>
</html>
